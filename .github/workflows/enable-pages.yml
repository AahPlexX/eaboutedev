name: Enable GitHub Pages

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: write
  pages: write

jobs:
  enable:
    if: >-
      github.event.pull_request.head.ref == 'release/verify-pages' ||
      github.event.pull_request.head.ref == 'release/enable-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages with GitHub Actions publishing
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Record successful enablement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt="Pages enabled for GitHub Actions publishing on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          encoded="$(printf '%s\n' "$receipt" | base64 -w 0)"
          curl --fail-with-body --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.pages-enabled-receipt" \
            --data "{\"message\":\"release: record Pages enablement\",\"content\":\"${encoded}\",\"branch\":\"main\"}"
