name: Turn 12 final recovery
on:
  push:
    branches: [main]
    paths: [docs/turn12-final-recovery-trigger.txt]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate planned topic set with collision-free checklist helper
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/turn12-topic-expansion.yml').read_text()
          start = text.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          anchor = "def checkpoint(prompt, answer, explanation): return {'type': 'checkpoint', 'prompt': prompt, 'answer': answer, 'explanation': explanation}\n"
          helper = "def checklist_block(items): return {'type': 'checklist', 'items': items}\n"
          if anchor not in script:
              raise SystemExit('checklist helper anchor not found')
          script = script.replace(anchor, anchor + helper, 1).replace('checklist([', 'checklist_block([')
          Path('/tmp/turn12-author.py').write_text(script)
          PY
          python -m py_compile /tmp/turn12-author.py
          python /tmp/turn12-author.py
      - name: Focused anatomy contract
        run: node --test --experimental-strip-types tests/anatomy-block.test.ts
      - name: Regenerate and validate topic graph
        run: pnpm run generate && pnpm run validate:content
      - name: Verify every new official source URL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const names = ['browser-devtools-and-systematic-debugging.json','testing-web-applications.json','web-accessibility.json','web-security-foundations.json'];
          const urls=[];
          for (const name of names) for (const source of JSON.parse(await readFile(`public/content/topics/${name}`,'utf8')).sources) urls.push(source.url);
          await writeFile('/tmp/urls.txt',[...new Set(urls)].join('\n'));
          NODE
          while IFS= read -r url; do
            echo "Checking $url"
            code=$(curl -L -sS -o /dev/null --max-time 30 -w '%{http_code}' "$url")
            case "$code" in 2*|3*) ;; *) echo "Unexpected HTTP $code for $url"; exit 1 ;; esac
          done < /tmp/urls.txt
      - name: Exact Knip dead-code and dependency audit
        shell: bash
        run: |
          cat > knip.json <<'JSON'
          {"$schema":"https://unpkg.com/knip@6/schema.json","entry":["src/main.tsx","vite.config.ts","scripts/*.mjs","tests/**/*.test.ts"],"project":["src/**/*.{ts,tsx}","scripts/**/*.mjs","tests/**/*.ts"],"ignore":["src/generated/**"],"includeEntryExports":true}
          JSON
          pnpm dlx knip@6.14.2
          rm knip.json
      - name: Full project gate
        run: pnpm run check
      - name: Remove all temporary Turn 12 scaffolding and diagnostics
        shell: bash
        run: |
          rm -f \
            .github/workflows/turn12-topic-expansion.yml \
            .github/workflows/turn12-diagnostic.yml \
            .github/workflows/turn12-author-diagnostic.yml \
            .github/workflows/turn12-recovery.yml \
            .github/workflows/turn12-recovery-diagnostic.yml \
            .github/workflows/turn12-final-recovery.yml \
            docs/turn12-topic-expansion-trigger.txt \
            docs/turn12-diagnostic-trigger.txt \
            docs/turn12-author-diagnostic-trigger.txt \
            docs/turn12-recovery-trigger.txt \
            docs/turn12-recovery-diagnostic-trigger.txt \
            docs/turn12-final-recovery-trigger.txt \
            docs/turn12-diagnostic.txt \
            docs/turn12-author-diagnostic.txt \
            docs/turn12-recovery-diagnostic.txt
      - name: Commit verified expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add four quality foundation topics and syntax anatomy"
          git push origin HEAD:main
