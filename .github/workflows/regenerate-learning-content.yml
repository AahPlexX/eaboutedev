name: Regenerate learning content artifacts

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: regenerate-learning-content
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full project verification and generation
        run: pnpm check

      - name: Commit deterministic generated artifacts
        run: |
          git add src/generated/topic-catalog.ts public/search/topic-search-index.json docs/topic-registry.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already match source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate learning content artifacts [skip ci]"
          git push origin HEAD:main
