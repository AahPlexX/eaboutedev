name: Turn 9 live narration QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/turn9-live-qa.yml

permissions:
  contents: write

concurrency:
  group: turn9-live-narration-qa
  cancel-in-progress: true

jobs:
  live-qa:
    name: Verify deployed narration in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install exact Playwright and Chromium outside the project graph
        shell: bash
        run: |
          mkdir -p /tmp/eaboutedev-live-qa
          cd /tmp/eaboutedev-live-qa
          npm init -y >/dev/null
          npm install --save-exact playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Exercise the deployed player
        shell: bash
        run: |
          cat > /tmp/eaboutedev-live-qa/qa.mjs <<'NODE'
          import { chromium } from "playwright";
          import { writeFile } from "node:fs/promises";

          const url = "https://aahplexx.github.io/eaboutedev/#/topics/how-the-web-works";
          const resultPath = `${process.env.GITHUB_WORKSPACE}/docs/turn9-live-qa-result.json`;
          const result = {
            checkedAt: new Date().toISOString(),
            url,
            playwright: "1.62.0",
            deployedMarker: false,
            desktopNoHorizontalOverflow: false,
            mobileNoHorizontalOverflow: false,
            controlMinHeightPx: null,
            transcriptCurrentCount: null,
            neuralStarted: false,
            pauseWorked: false,
            resumeWorked: false,
            relevantNetworkHosts: [],
            relevantFailedResponses: [],
            consoleErrors: [],
            success: false,
            failure: null
          };

          const browser = await chromium.launch({ headless: true });
          const relevantHosts = new Set();
          const failedResponses = [];
          const consoleErrors = [];

          try {
            const desktop = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const page = await desktop.newPage();
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("request", (request) => {
              const host = new URL(request.url()).hostname;
              if (host.includes("jsdelivr.net") || host.includes("huggingface.co") || host.includes("hf.co")) relevantHosts.add(host);
            });
            page.on("response", (response) => {
              const host = new URL(response.url()).hostname;
              if ((host.includes("jsdelivr.net") || host.includes("huggingface.co") || host.includes("hf.co")) && response.status() >= 400) {
                failedResponses.push({ url: response.url(), status: response.status() });
              }
            });

            let markerFound = false;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 30_000 });
              try {
                await page.getByRole("heading", { name: "Listen to this topic" }).waitFor({ state: "visible", timeout: 5_000 });
                markerFound = true;
                break;
              } catch {
                await page.waitForTimeout(4_000);
              }
            }
            if (!markerFound) throw new Error("The deployed Pages site never exposed the Turn 9 narration player.");
            result.deployedMarker = true;
            result.desktopNoHorizontalOverflow = await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 1);

            await page.getByRole("button", { name: "Play narration" }).click();
            const neuralOutcome = await Promise.race([
              page.waitForFunction(() => {
                const audio = document.querySelector("audio");
                return Boolean(audio && !audio.paused && Number.isFinite(audio.duration) && audio.duration > 0);
              }, { timeout: 240_000 }).then(() => "playing"),
              page.locator(".narration-status").filter({ hasText: /High-quality narration is unavailable|could not start|could not be played/i }).waitFor({ state: "visible", timeout: 240_000 }).then(() => "error")
            ]);

            if (neuralOutcome !== "playing") {
              const status = await page.locator(".narration-status").innerText();
              throw new Error(`Neural narration did not start: ${status}`);
            }
            result.neuralStarted = true;

            await page.getByRole("button", { name: "Pause" }).click();
            await page.locator(".narration-status").filter({ hasText: /Paused at passage/ }).waitFor({ state: "visible", timeout: 10_000 });
            result.pauseWorked = await page.evaluate(() => Boolean(document.querySelector("audio")?.paused));

            await page.getByRole("button", { name: "Resume" }).click();
            await page.waitForFunction(() => Boolean(document.querySelector("audio") && !document.querySelector("audio").paused), { timeout: 10_000 });
            result.resumeWorked = true;
            result.transcriptCurrentCount = await page.locator('[aria-label="Narration transcript"] [aria-current="true"]').count();
            result.controlMinHeightPx = Math.round((await page.getByRole("button", { name: "Pause" }).evaluate((element) => element.getBoundingClientRect().height)) * 100) / 100;
            await desktop.close();

            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const mobilePage = await mobile.newPage();
            await mobilePage.goto(url, { waitUntil: "domcontentloaded", timeout: 30_000 });
            await mobilePage.getByRole("heading", { name: "Listen to this topic" }).waitFor({ state: "visible", timeout: 10_000 });
            result.mobileNoHorizontalOverflow = await mobilePage.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 1);
            await mobile.close();

            result.relevantNetworkHosts = [...relevantHosts].sort();
            result.relevantFailedResponses = failedResponses;
            result.consoleErrors = consoleErrors;
            result.success = Boolean(
              result.deployedMarker && result.desktopNoHorizontalOverflow && result.mobileNoHorizontalOverflow &&
              result.neuralStarted && result.pauseWorked && result.resumeWorked && result.transcriptCurrentCount === 1 &&
              typeof result.controlMinHeightPx === "number" && result.controlMinHeightPx >= 44 && result.relevantFailedResponses.length === 0
            );
          } catch (error) {
            result.failure = error instanceof Error ? error.message : String(error);
            result.relevantNetworkHosts = [...relevantHosts].sort();
            result.relevantFailedResponses = failedResponses;
            result.consoleErrors = consoleErrors;
          } finally {
            await browser.close();
            await writeFile(resultPath, `${JSON.stringify(result, null, 2)}\n`);
          }
          NODE
          cd /tmp/eaboutedev-live-qa
          node qa.mjs

      - name: Commit live QA evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/turn9-live-qa-result.json
          if ! git diff --cached --quiet; then
            git commit -m "test: record Turn 9 live narration QA"
            git push origin HEAD:main
          fi

      - name: Enforce live QA result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile("docs/turn9-live-qa-result.json", "utf8"));
          if (!result.success) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify(result, null, 2));
          NODE
