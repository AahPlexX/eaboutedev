name: Expand initial source bundle

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Recover, verify, and expand source tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-chunks
          curl --fail-with-body --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8955971754/zip" \
            --output /tmp/source-chunks.zip
          unzip -q /tmp/source-chunks.zip -d /tmp/source-chunks
          python - <<'PY'
          from pathlib import Path

          chunk = Path('/tmp/source-chunks/chunk-02')
          encoded = chunk.read_text(encoding='utf-8')
          if len(encoded) != 12_000 or encoded[8_798] != 'W':
              raise SystemExit('Source archive repair precondition failed.')
          chunk.write_text(encoded[:8_798] + 'G' + encoded[8_799:], encoding='utf-8')
          PY
          cat /tmp/source-chunks/chunk-* | base64 --decode > /tmp/project.tar.gz
          echo "bac97e7f8a5d2f8792e5fc965f00dd06b81d654670f59739a7801c857f138125  /tmp/project.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -f .github/workflows/pages.yml
          rm -rf .bootstrap .source-expand-trigger .github/workflows/expand-review-source.yml
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git add --all
          git commit -m "feat: build initial development reference"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
