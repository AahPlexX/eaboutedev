name: Expand initial source bundle

on:
  pull_request:
    branches: [main]
    paths:
      - .bootstrap/**

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Verify and expand source tree
        shell: bash
        run: |
          shopt -s nullglob
          chunks=(.bootstrap/chunk-*)
          if (( ${#chunks[@]} != 7 )); then
            echo "Expected 7 source bundle chunks; found ${#chunks[@]}."
            exit 1
          fi
          cat "${chunks[@]}" | base64 --decode > /tmp/project.tar.gz
          echo "bac97e7f8a5d2f8792e5fc965f00dd06b81d654670f59739a7801c857f138125  /tmp/project.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .bootstrap
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git add --all
          git commit -m "feat: build initial development reference"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
