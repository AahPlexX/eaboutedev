name: Turn 12 full diagnostic
on:
  push:
    branches: [main]
    paths: [docs/turn12-full-diagnostic-trigger.txt]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Prepare corrected author script
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          python <<'PY' > /tmp/prepare.txt 2>&1
          from pathlib import Path
          text = Path('.github/workflows/turn12-topic-expansion.yml').read_text()
          start = text.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          anchor = "def checkpoint(prompt, answer, explanation): return {'type': 'checkpoint', 'prompt': prompt, 'answer': answer, 'explanation': explanation}\n"
          if anchor not in script: raise SystemExit('helper anchor absent')
          script = script.replace(anchor, anchor + "def checklist_block(items): return {'type': 'checklist', 'items': items}\n", 1)
          script = script.replace('checklist([', 'checklist_block([')
          Path('/tmp/turn12-author.py').write_text(script)
          PY
          cat /tmp/prepare.txt
          python -m py_compile /tmp/turn12-author.py
      - name: Execute author script
        id: author
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python /tmp/turn12-author.py > /tmp/author.txt 2>&1; status=$?; cat /tmp/author.txt; exit $status
      - name: Anatomy test
        id: anatomy
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        run: node --test --experimental-strip-types tests/anatomy-block.test.ts > /tmp/anatomy.txt 2>&1; status=$?; cat /tmp/anatomy.txt; exit $status
      - name: Generate and validate
        id: content
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        run: pnpm run generate && pnpm run validate:content > /tmp/content.txt 2>&1
      - name: Link audit
        id: links
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const names=['browser-devtools-and-systematic-debugging.json','testing-web-applications.json','web-accessibility.json','web-security-foundations.json']; const urls=[];
          for (const n of names) for (const s of JSON.parse(await readFile(`public/content/topics/${n}`,'utf8')).sources) urls.push(s.url);
          await writeFile('/tmp/urls.txt',[...new Set(urls)].join('\n'));
          NODE
          : > /tmp/links.txt; failed=0
          while IFS= read -r url; do code=$(curl -L -sS -o /dev/null --max-time 30 -w '%{http_code}' "$url" || true); echo "$code $url" >> /tmp/links.txt; case "$code" in 2*|3*) ;; *) failed=1 ;; esac; done < /tmp/urls.txt
          cat /tmp/links.txt; exit $failed
      - name: Knip audit
        id: knip
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cat > knip.json <<'JSON'
          {"$schema":"https://unpkg.com/knip@6/schema.json","entry":["src/main.tsx","vite.config.ts","scripts/*.mjs","tests/**/*.test.ts"],"project":["src/**/*.{ts,tsx}","scripts/**/*.mjs","tests/**/*.ts"],"ignore":["src/generated/**"],"includeEntryExports":true}
          JSON
          set +e; pnpm dlx knip@6.14.2 > /tmp/knip.txt 2>&1; status=$?; cat /tmp/knip.txt; rm knip.json; exit $status
      - name: Project check
        id: check
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        run: pnpm run check > /tmp/check.txt 2>&1; status=$?; cat /tmp/check.txt; exit $status
      - name: Commit diagnostic evidence
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          AUTHOR: ${{ steps.author.outcome }}
          ANATOMY: ${{ steps.anatomy.outcome }}
          CONTENT: ${{ steps.content.outcome }}
          LINKS: ${{ steps.links.outcome }}
          KNIP: ${{ steps.knip.outcome }}
          CHECK: ${{ steps.check.outcome }}
        shell: bash
        run: |
          {
            echo "prepare=$PREPARE author=$AUTHOR anatomy=$ANATOMY content=$CONTENT links=$LINKS knip=$KNIP check=$CHECK"
            for f in prepare author anatomy content links knip check; do echo "--- $f ---"; cat "/tmp/$f.txt" 2>/dev/null || true; done
          } > docs/turn12-full-diagnostic.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/turn12-full-diagnostic.txt; git commit -m "test: record full Turn 12 diagnostics" || true; git push origin HEAD:main
