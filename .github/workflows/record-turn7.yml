name: Record Turn 7 scalability completion

on:
  push:
    branches: [main]
    paths:
      - docs/turn7-record-trigger.txt

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Append Turn 7 completion records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path('changelog.md')
          changelog_marker = '### Scalability hardening implementation — Turn 7, sequence 2'
          if changelog_marker not in changelog.read_text():
              changelog.write_text(changelog.read_text().rstrip() + '''\n\n### Scalability hardening implementation — Turn 7, sequence 2\n\n- Replaced progressive “Show more” discovery with true fixed 24-topic pagination and compact Previous/numbered/Next controls.\n- Added URL-addressable `q`, `category`, `sort`, and `page` state with safe invalid-page normalization and page reset after filter/sort changes.\n- Added Recommended, A–Z, Shortest first, Longest first, and Foundational → Advanced stable sorting.\n- Moved the complete catalog out of eager application JavaScript into `public/catalog/topic-catalog.json`; homepage discovery now consumes a generated bootstrap bounded to six topic cards plus total count.\n- Added shared in-session catalog/topic request deduplication with retryable failures and preserved topic 404 behavior.\n- Lazy-loaded catalog and topic route implementations and dynamically loaded global search only after a non-empty query.\n- Moved MiniSearch `addAll()` index construction to build-time generation and changed the browser to asynchronously restore the serialized `public/search/topic-search.minisearch.json` index.\n- Removed the redundant source-like search corpus and obsolete generated TypeScript full catalog.\n- Added 100/500/1,000-topic scale-shape tests, URL-state/loader/search-restoration regression tests, and deterministic catalog/search/bootstrap byte budgets.\n- Tightened permanent generated-artifact verification so CI detects both modified and newly untracked generated discovery files.\n\n### Verification — Turn 7, sequence 2\n\n- The first GitHub-hosted run passed generation, five-topic content validation, exact-version validation, generated freshness, discovery budgets, all 25 tests, and TypeScript; Oxlint correctly stopped on one `unicorn/no-array-sort` warning.\n- Replaced copied mutable `.sort()` with native immutable `.toSorted()` and reran the complete GitHub-hosted `pnpm check`.\n- The success-only verifier then returned exit code 0 and committed exact generated artifacts at `e89fd173dd180b92c89626923f379e2306c87107`; all 25 tests, TypeScript, Oxlint with denied warnings, and the Vite production build passed.\n- Removed the temporary scalability verifier, resolved failure diagnostic, and verification trigger after success.\n- No database, CMS, backend search/pagination, infinite scroll, virtualization, Web Worker, service worker, state library, persistent browser cache, or configurable page size was added.\n''')

          todo = Path('todo.md')
          todo_marker = '### Scalability implementation outcome — Turn 7, sequence 2'
          if todo_marker not in todo.read_text():
              todo.write_text(todo.read_text().rstrip() + '''\n\n### Scalability implementation outcome — Turn 7, sequence 2\n\n- [x] Review and approve the Turn 7 scalability specification.\n- [x] Commit the task-by-task scalability implementation plan.\n- [x] Implement the five approved sort modes and fixed 24-topic true pagination.\n- [x] Persist query/category/sort/page catalog state in URL search parameters.\n- [x] Move the full catalog to lazy static JSON and bound homepage bootstrap metadata to six entries plus count.\n- [x] Add catalog/topic in-session request reuse with retry after failures.\n- [x] Lazy-load catalog/topic routes and dynamically import search only for non-empty queries.\n- [x] Prebuild MiniSearch during generation and asynchronously restore the serialized index in the browser.\n- [x] Remove obsolete `src/generated/topic-catalog.ts` and `public/search/topic-search-index.json`.\n- [x] Add 100/500/1,000-topic scale-shape coverage and deterministic generated-discovery size budgets.\n- [x] Make permanent generated-artifact CI verification detect untracked generated outputs.\n- [x] Pass GitHub-hosted `pnpm check` after correcting the single denied Oxlint warning: 25/25 tests, TypeScript, Oxlint, and production build all green.\n- [x] Commit exact generated discovery artifacts and remove temporary verification scaffolding.\n\n### Remaining release verification\n\n- [ ] Independently confirm the latest permanent GitHub Pages deployment completes after the clean `main` updates.\n- [ ] Inspect the deployed catalog/search interaction at `https://aahplexx.github.io/eaboutedev/`.\n''')

          codemap = Path('codemap.json')
          text = codemap.read_text()
          marker = '"summary": "Implemented catalog/search scalability hardening for large topic growth"'
          if marker not in text:
              entry = '''    {\n      "turncount": 7,\n      "sequence": 2,\n      "date": "2026-08-07",\n      "summary": "Implemented catalog/search scalability hardening for large topic growth",\n      "areas": [\n        {"path": "src/lib/catalog.ts", "responsibility": "Pure metadata filtering, five-mode stable sorting, fixed 24-item pagination, result ranges, and compact pagination model"},\n        {"path": "src/lib/catalog-state.ts", "responsibility": "Canonical q/category/sort/page URL parsing, default omission, and invalid-state normalization"},\n        {"path": "src/lib/catalog-loader.ts", "responsibility": "Lazy full-catalog fetch with in-flight/success reuse and retry after failure"},\n        {"path": "src/lib/topic-loader.ts", "responsibility": "Per-slug topic request reuse while preserving invalid-slug and 404 semantics and retryable transport failures"},\n        {"path": "src/components/topics/catalog-pagination.tsx", "responsibility": "Accessible compact Previous/page/Next controls with current-page semantics and wrap-safe layout"},\n        {"path": "src/pages/topics-page.tsx", "responsibility": "URL-driven filter/sort/page catalog experience rendering only the active 24-item page with loading, retry, and normalized-page behavior"},\n        {"path": "src/pages/home-page.tsx", "responsibility": "Eager homepage limited to generated six-topic bootstrap metadata rather than the complete catalog"},\n        {"path": "src/pages/topic-page.tsx", "responsibility": "Independent topic load plus non-blocking related-topic metadata resolution through the shared lazy catalog"},\n        {"path": "src/app.tsx", "responsibility": "Eager shell/home route with code-split catalog and topic route implementations"},\n        {"path": "src/hooks/use-search.ts", "responsibility": "Debounced non-empty-query dynamic import boundary for global search implementation"},\n        {"path": "src/lib/search.ts", "responsibility": "On-demand asynchronous restoration and reuse of the build-time serialized MiniSearch index"},\n        {"path": "src/lib/search-config.ts", "responsibility": "Shared generation/runtime MiniSearch fields, stored result metadata, weights, and identifier contract"},\n        {"path": "scripts/content-utils.mjs", "responsibility": "Lean catalog projection and non-duplicated search-index source projection from authoritative topics"},\n        {"path": "scripts/generate-content-artifacts.mjs", "responsibility": "Deterministic lazy catalog, bounded homepage bootstrap, serialized MiniSearch index, and topic-registry generation"},\n        {"path": "scripts/validate-discovery-assets.mjs", "responsibility": "Per-topic catalog/search byte budgets, fixed bootstrap budget, obsolete-artifact checks, and eager-import regression guardrails"},\n        {"path": "public/catalog/topic-catalog.json", "responsibility": "Generated complete lean catalog fetched only by experiences that require the complete catalog"},\n        {"path": "src/generated/topic-bootstrap.ts", "responsibility": "Generated bounded homepage metadata containing topic count and at most six featured cards"},\n        {"path": "public/search/topic-search.minisearch.json", "responsibility": "Generated prebuilt MiniSearch index restored only after search is actually used"},\n        {"path": "tests/catalog.test.ts", "responsibility": "Sorting, pagination, compact control, and 100/500/1000-topic scale-shape regression proof"},\n        {"path": "tests/catalog-state.test.ts", "responsibility": "Catalog URL-state normalization and default-serialization regression proof"},\n        {"path": "tests/catalog-loader.test.ts", "responsibility": "Catalog request deduplication and retry regression proof"},\n        {"path": "tests/topic-loader.test.ts", "responsibility": "Topic request reuse, 404, invalid slug, and failed-request retry regression proof"},\n        {"path": "tests/discovery-assets.test.ts", "responsibility": "Generated discovery, eager-boundary, serialized-index restoration, and search-result regression proof"},\n        {"path": ".github/workflows/actions.yml", "responsibility": "Pull-request verification that now detects stale, modified, or untracked generated discovery artifacts"},\n        {"path": ".github/workflows/pages.yml", "responsibility": "Permanent main-only production verification/build/deploy path with strict generated discovery integrity checks"},\n        {"path": "changelog.md", "responsibility": "Append-only Turn 7 implementation and GitHub-hosted validation evidence"},\n        {"path": "todo.md", "responsibility": "Append-only Turn 7 implementation completion ledger with only independent live deployment inspection remaining"},\n        {"path": "codemap.json", "responsibility": "Append-only map of the implemented scalable discovery architecture"}\n      ]\n    }'''
              closing = '\n  ]\n}\n'
              if not text.endswith(closing):
                  raise SystemExit('codemap closing structure changed unexpectedly')
              text = text[:-len(closing)] + ',\n' + entry + closing
              codemap.write_text(text)
          PY

      - name: Commit records and remove this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/record-turn7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md todo.md codemap.json .github/workflows/record-turn7.yml
          git commit -m "docs: record catalog scalability hardening"
          git push
