                      {'title': 'Conditional rendering', 'summary': 'JavaScript conditions choose which UI description should be returned.', 'example': 'isAdmin ? <AdminTools /> : null'},
                      {'title': 'Keys', 'summary': 'Stable identities for sibling elements created from collections so React can match them across renders.', 'example': 'items.map(item => <Row key={item.id} />)'}
