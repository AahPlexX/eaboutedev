                {'label': 'Type checker', 'detail': 'Analyzes assignments, control flow, function calls, modules, and configuration for contradictions.'},
                {'label': 'JavaScript output or transformed source', 'detail': 'Type-only syntax is removed; another tool may perform the transformation.'},
