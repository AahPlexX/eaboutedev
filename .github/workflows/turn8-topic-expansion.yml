                  'blocks': [
                    {'type': 'paragraph', 'text': 'A browser and Node.js can both execute JavaScript, but they do not expose the same surrounding capabilities. A browser gives code a document, windows, navigation, and other web-platform APIs. Node.js gives server and command-line programs access to capabilities such as the file system, processes, streams, and network servers. The language syntax may look identical while the runtime environment is different.'},
                    {'type': 'table', 'columns': ['Question', 'Browser example', 'Node.js example'], 'rows': [
                      ['What user interface exists?', 'DOM elements rendered in a page.', 'Usually none unless the program creates a server or terminal interface.'],
