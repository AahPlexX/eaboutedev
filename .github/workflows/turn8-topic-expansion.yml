                    {'type': 'code', 'language': 'JavaScript', 'code': 'function formatPrice(price) {\n  return price.toFixed(2);\n}\n\nformatPrice("19.99");', 'explanation': 'The function assumes price is a number, but JavaScript allows a string to reach the call. The failure appears only when toFixed is attempted at runtime.'},
