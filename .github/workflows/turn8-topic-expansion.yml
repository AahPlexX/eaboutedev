                    {'type': 'code', 'language': 'JSX', 'code': 'function ItemList({ items }) {\n  return (\n    <ul>\n      {items.map((item) => (\n        <li key={item.id}>{item.label}</li>\n      ))}\n    </ul>\n  );\n}', 'explanation': 'map creates one list item per data item. item.id is a stable identity from the data, so React can associate the same logical item with the same rendered position across updates. The key is not displayed to the user.'},
                    {'type': 'callout', 'tone': 'warning', 'title': 'Do not cause side effects during render', 'body': 'Rendering may happen more than once. Network calls, subscriptions, DOM mutations, and storage writes do not belong in the calculation phase merely because the component function can execute JavaScript.'}
