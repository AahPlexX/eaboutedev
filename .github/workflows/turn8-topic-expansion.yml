                      {'title': 'Declare the dependency requirement', 'explanation': 'The manifest records the package and allowed version rule.', 'result': 'The project states what it is compatible with.'},
                      {'title': 'Resolve the graph', 'explanation': 'The package manager chooses package versions and transitive dependencies that satisfy the graph.', 'result': 'A concrete dependency graph exists.'},
                      {'title': 'Record the lockfile', 'explanation': 'The resolved versions, sources, and integrity information are written into the manager’s lockfile.', 'result': 'Later installs can reproduce the same resolution.'},
                      {'title': 'Use frozen installation in CI', 'explanation': 'CI refuses to silently rewrite dependency resolution.', 'result': 'A manifest/lockfile mismatch becomes visible before build or deployment.'}
                    ]},
                    {'type': 'paragraph', 'text': 'Semantic version rules such as exact versions, ranges, and tags influence what the resolver may choose. The lockfile then captures the actual graph chosen for that project. Application repositories normally commit their lockfile so developers, CI, and deployments share the same resolved dependency state.'}
                  ]
                },
                {
