name: Turn 8 curriculum expansion

on:
  push:
    branches: [main]
    paths:
      - docs/turn8-topic-expansion-trigger.txt

permissions:
  contents: write

concurrency:
  group: turn8-topic-expansion
  cancel-in-progress: true

jobs:
  integrate:
    name: Build, validate, and commit four new guides
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Write researched topic sources and discovery integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          topic_dir = Path('public/content/topics')

          topics = {
            'nodejs-and-package-management.json': {
              'version': 1,
              'slug': 'nodejs-and-package-management',
              'title': 'Node.js and Package Management',
              'eyebrow': 'JavaScript tooling foundation · Runtime, packages, scripts, and reproducible installs',
              'summary': 'Start with one JavaScript file that needs to run outside the browser, then learn how Node.js executes it, how package.json describes a project, how package managers resolve dependencies, why lockfiles matter, how ESM and CommonJS differ, and how to keep installs secure and reproducible.',
