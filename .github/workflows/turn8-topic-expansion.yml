                      {'title': 'Rewrite public URLs', 'explanation': 'Asset references account for the configured base path.', 'result': 'Static hosting under the intended URL prefix can find its assets.'}
                    ]},
                    {'type': 'code', 'language': 'JavaScript · dynamic import', 'code': 'const settingsModule = await import("./settings.js");\nsettingsModule.openSettings();', 'explanation': 'A dynamic import introduces an asynchronous module boundary. In a production build it can become a separately loaded chunk instead of being required in the initial application chunk.'},
                    {'type': 'checkpoint', 'prompt': 'Your app works at / during local development but is deployed at /my-app/ and all built assets 404. Which build setting should you inspect first?', 'answer': 'The Vite base path and the actual hosting path.', 'explanation': 'The production build rewrites asset URLs using base. A correct application can still fail when the generated URLs point at the wrong public root.'}
                  ]
                },
                {
                  'id': 'deploy-and-debug',
                  'title': '7. Debug Vite by locating whether the failure is resolution, transformation, runtime behavior, or deployment',
                  'summary': 'The fastest diagnosis starts by identifying the stage that first produced the wrong result instead of repeatedly clearing caches or changing configuration.',
                  'blocks': [
                    {'type': 'table', 'columns': ['Symptom', 'First place to inspect', 'Typical evidence'], 'rows': [
                      ['Import cannot be resolved', 'Specifier, alias, package exports, file path', 'Dev server/build resolution error.'],
                      ['Type error not caught by Vite', 'Separate TypeScript check', 'tsc fails while transformation succeeds.'],
                      ['Environment value is undefined', 'Mode, .env filename, prefix, process environment', 'import.meta.env lacks the expected key.'],
                      ['Production asset 404', 'base path and hosting location', 'HTML or JS points at the wrong public URL.'],
                      ['Lazy chunk fails after deployment', 'Deployed artifact completeness and cache/version behavior', 'Network panel shows missing or stale chunk URL.'],
                      ['HMR behaves oddly', 'Plugin/framework HMR boundary and module side effects', 'Full reload works but hot replacement cannot preserve the module safely.']
                    ], 'caption': 'Locate the failing pipeline stage before changing build configuration'},
                    {'type': 'checklist', 'items': [
                      'Run the production build in CI rather than assuming the dev server proves deployability.',
                      'Serve or preview the built output when diagnosing production-only behavior.',
                      'Keep client secrets out of VITE_-exposed variables.',
                      'Set base to the real deployment prefix for nested static hosting such as project GitHub Pages.',
                      'Keep type checking as a separate explicit gate for TypeScript projects.',
                      'Add plugins only for named transformation or integration requirements.',
                      'Measure bundle/chunk problems before adding manual chunking or complicated optimization rules.'
                    ]}
                  ]
                }
              ],
              'glossary': [
                {'term': 'Build tool', 'definition': 'Software that coordinates development serving, source transformation, dependency resolution, and production asset generation.'},
                {'term': 'ES module', 'definition': 'The standard JavaScript module format built around import and export.'},
                {'term': 'Module graph', 'definition': 'The network of modules connected by imports and other tracked resource relationships.'},
                {'term': 'Dev server', 'definition': 'A development-time HTTP server that serves and transforms source while providing fast feedback features.'},
                {'term': 'HMR', 'definition': 'Hot Module Replacement: updating affected modules in a running page without necessarily performing a full reload.'},
                {'term': 'Transpilation', 'definition': 'Transforming source syntax into another JavaScript form without necessarily performing semantic type checking.'},
                {'term': 'Plugin', 'definition': 'An extension that participates in Vite’s resolution, loading, transformation, or build pipeline through supported hooks.'},
                {'term': 'Mode', 'definition': 'A named Vite configuration context such as development, production, or a custom staging mode.'},
                {'term': 'Base path', 'definition': 'The public URL prefix Vite uses when generating or resolving built application asset URLs.'},
                {'term': 'Chunk', 'definition': 'A separately emitted JavaScript output unit produced from part of the module graph.'},
                {'term': 'Code splitting', 'definition': 'Dividing application code into separately loadable chunks instead of requiring all code in the initial payload.'},
                {'term': 'Rolldown', 'definition': 'The Rust-based bundler used by current Vite production builds.'}
              ],
              'related': ['html-css-and-javascript', 'nodejs-and-package-management', 'typescript', 'react', 'git-and-github'],
              'sources': [
                {'label': 'Vite — Getting Started', 'url': 'https://vite.dev/guide/', 'accessed': '2026-08-08'},
                {'label': 'Vite — Why Vite', 'url': 'https://vite.dev/guide/why', 'accessed': '2026-08-08'},
                {'label': 'Vite — Features', 'url': 'https://vite.dev/guide/features.html', 'accessed': '2026-08-08'},
                {'label': 'Vite — Env Variables and Modes', 'url': 'https://vite.dev/guide/env-and-mode', 'accessed': '2026-08-08'},
                {'label': 'Vite — Building for Production', 'url': 'https://vite.dev/guide/build', 'accessed': '2026-08-08'},
                {'label': 'Vite — Plugin API', 'url': 'https://vite.dev/guide/api-plugin', 'accessed': '2026-08-08'},
                {'label': 'Vite — Deploying a Static Site', 'url': 'https://vite.dev/guide/static-deploy', 'accessed': '2026-08-08'}
              ]
            }
          }

          for filename, document in topics.items():
              (topic_dir / filename).write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n')

          def add_related(slug, additions):
              path = topic_dir / f'{slug}.json'
              document = json.loads(path.read_text())
              for related in additions:
                  if related not in document['related']:
                      document['related'].append(related)
              path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n')

          add_related('html-css-and-javascript', ['typescript', 'react', 'vite'])
          add_related('git-and-github', ['nodejs-and-package-management', 'vite'])

          content_utils = Path('scripts/content-utils.mjs')
          text = content_utils.read_text()
          marker = 'export const topicDirectory = path.join(rootDirectory, "public/content/topics");\n\n'
          order_block = '''export const recommendedTopicOrder = new Map([\n  ["how-the-web-works", 0],\n  ["html-css-and-javascript", 1],\n  ["git-and-github", 2],\n  ["nodejs-and-package-management", 3],\n  ["typescript", 4],\n  ["react", 5],\n  ["vite", 6],\n  ["apis-and-data-exchange", 7],\n  ["the-seven-types-of-databases", 8],\n]);\n\n'''
          if 'recommendedTopicOrder' not in text:
              text = text.replace(marker, marker + order_block)
          text = text.replace('    order,\n', '    order: recommendedTopicOrder.get(topic.slug) ?? recommendedTopicOrder.size + order,\n')
          content_utils.write_text(text)

          generator = Path('scripts/generate-content-artifacts.mjs')
          text = generator.read_text()
          text = text.replace(
              'const catalog = topics.map(({ document }, order) => createCatalogEntry(document, order));',
              'const catalog = topics\\n  .map(({ document }, order) => createCatalogEntry(document, order))\\n  .toSorted((left, right) => left.order - right.order || left.title.localeCompare(right.title, "en"));'
          )
          generator.write_text(text)

          test_file = Path('tests/discovery-assets.test.ts')
          text = test_file.read_text()
          text = text.replace('assert.match(generator, /featuredTopics: catalog\\.slice\\(0, 6\\)/);', 'assert.match(generator, /featuredTopics: catalog\\.slice\\(0, 6\\)/);')
          text = text.replace('  assert.ok(Array.isArray(JSON.parse(catalog)));\n', '  const catalogEntries = JSON.parse(catalog) as Array<{ slug: string; order: number }>;\n  assert.ok(Array.isArray(catalogEntries));\n  assert.equal(catalogEntries[0]?.slug, "how-the-web-works");\n  assert.deepEqual(catalogEntries.map(({ order }) => order), catalogEntries.map(({ order }) => order).toSorted((left, right) => left - right));\n')
          text = text.replace('  const graphResults = search.search("graph db", { combineWith: "OR", prefix: true, fuzzy: 0.2 }) as Array<{ slug?: string }>;\n', '  const graphResults = search.search("graph db", { combineWith: "OR", prefix: true, fuzzy: 0.2 }) as Array<{ slug?: string }>;\n  const reactResults = search.search("component state effect", { combineWith: "OR", prefix: true, fuzzy: 0.2 }) as Array<{ slug?: string }>;\n')
          text = text.replace('  assert.ok(graphResults.some((result) => result.slug === "the-seven-types-of-databases"));\n', '  assert.ok(graphResults.some((result) => result.slug === "the-seven-types-of-databases"));\n  assert.ok(reactResults.some((result) => result.slug === "react"));\n')
          test_file.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'A visual, plain-language, deeply sourced reference for understanding web development as one connected system. The launch release includes complete guides for the web request lifecycle, HTML/CSS/JavaScript, seven practical database families, API contracts, and Git/GitHub workflows.',
              'A visual, plain-language, deeply sourced reference for understanding web development as one connected system. The current curriculum includes the web request lifecycle, HTML/CSS/JavaScript, Git/GitHub, Node.js and package management, TypeScript, React, Vite, API contracts, and seven practical database families.'
          )
          text = text.replace(
              '- `src/generated/topic-catalog.ts` for application discovery pages\n- `public/search/topic-search-index.json` for lazy search initialization\n- `docs/topic-registry.json` for auditable topic tracking and source hashes',
              '- `src/generated/topic-bootstrap.ts` for the bounded homepage preview and total topic count\n- `public/catalog/topic-catalog.json` for the lazy full catalog used by discovery pages\n- `public/search/topic-search.minisearch.json` for the build-time preconstructed search index\n- `docs/topic-registry.json` for auditable topic tracking and source hashes'
          )
          text = text.replace(
              'The application uses hash routing because GitHub Pages serves static files and does not provide application route rewrites. The Vite base path is `/eaboutedev/`. `.github/workflows/pages.yml` verifies pull requests and deploys every successful update to `main`.',
              'The application uses hash routing because GitHub Pages serves static files and does not provide application route rewrites. The Vite base path is `/eaboutedev/`. `.github/workflows/actions.yml` verifies pull requests; `.github/workflows/pages.yml` verifies, builds, and deploys successful updates to `main`.'
          )
          readme.write_text(text)
          PY

      - name: Run complete project gate
        id: gate
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/turn8-check.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            tail -n 600 /tmp/turn8-check.log > docs/turn8-topic-expansion-failure.txt
          fi

      - name: Record completed Turn 8 and commit integration
        if: steps.gate.outputs.status == '0'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path('changelog.md')
          marker = '## Turn 8 — 2026-08-08'
          if marker not in changelog.read_text():
              changelog.write_text(changelog.read_text().rstrip() + '''\n\n## Turn 8 — 2026-08-08\n\n**turncount: 8**\n\n### Curriculum expansion\n\n- Added four complete concrete-first guides: **Node.js and Package Management**, **TypeScript**, **React**, and **Vite**.\n- Preserved the agreed teaching sequence inside every guide: recognizable problem → mental model → real terminology → interpreted code/data → checkpoints → failure diagnosis → production operation → glossary and official sources.\n- Expanded related-topic navigation from the HTML/CSS/JavaScript and Git/GitHub guides into the new runtime, typed-language, framework, and build-tool material.\n- Replaced accidental filename-based “Recommended” order with an explicit curriculum order: How the Web Works → HTML/CSS/JavaScript → Git/GitHub → Node/package management → TypeScript → React → Vite → APIs → databases.\n- Regenerated the bounded homepage bootstrap, lazy full catalog, serialized MiniSearch index, and topic registry for nine total topics.\n- Updated README architecture documentation so it names the current scalable discovery artifacts rather than the removed eager catalog/search files.\n\n### Verification\n\n- Ran the complete GitHub-hosted `pnpm check` against the nine-topic source tree, including generation, content validation, exact-version validation, generated-artifact freshness, discovery-size guardrails, Node tests, TypeScript, Oxlint with denied warnings, and the Vite production build.\n- Added search-restoration coverage for React and discovery-order coverage proving the generated catalog starts with the intended recommended learning path.\n''')

          todo = Path('todo.md')
          marker = '## Turn 8 — 2026-08-08'
          if marker not in todo.read_text():
              todo.write_text(todo.read_text().rstrip() + '''\n\n## Turn 8 — 2026-08-08\n\n**turncount: 8**\n\n### Completed\n\n- [x] Add 2–5 new topics this turn; delivered four.\n- [x] Add Node.js and Package Management with runtime, manifest, dependency graph, lockfile, module-system, environment, and supply-chain depth.\n- [x] Add TypeScript with inference, unions/narrowing, objects, generics, modules/configuration, runtime-boundary, and production-checking depth.\n- [x] Add React with components/props, JSX/purity, state/events, state ownership, render/commit identity, Effects/refs, accessibility, and production-state depth.\n- [x] Add Vite with dev-server/HMR, module graph, transforms, plugins/configuration, environment modes, production build/base paths, and deployment diagnosis.\n- [x] Update related-topic links from existing guides into the new curriculum.\n- [x] Make Recommended sorting follow the explicit learning sequence instead of filename order.\n- [x] Regenerate catalog, homepage bootstrap, serialized search index, and topic registry.\n- [x] Update README, changelog, todo, and codemap so internal development documentation matches the current architecture and curriculum.\n- [x] Pass the complete GitHub-hosted project gate before committing the curriculum expansion.\n\n### Next curriculum expansion\n\n- [ ] Continue with another 2–5 dependency-ordered topics without weakening per-guide completeness.\n- [ ] Re-check branch authority, search coverage, recommended order, related links, generated artifacts, and internal docs in the same turn.\n''')

          codemap = Path('codemap.json')
          text = codemap.read_text()
          marker = '"summary": "Four-topic runtime, TypeScript, React, and Vite curriculum expansion"'
          if marker not in text:
              entry = '''    {\n      "turncount": 8,\n      "date": "2026-08-08",\n      "summary": "Four-topic runtime, TypeScript, React, and Vite curriculum expansion",\n      "areas": [\n        {"path": "public/content/topics/nodejs-and-package-management.json", "responsibility": "Concrete-first guide to Node runtime boundaries, package manifests, dependency graphs, lockfiles, ESM/CommonJS, scripts, environment input, and package supply-chain operation"},\n        {"path": "public/content/topics/typescript.json", "responsibility": "Concrete-first guide to static checking, inference, unions/narrowing, object types, generics, module configuration, runtime data boundaries, and production checking"},\n        {"path": "public/content/topics/react.json", "responsibility": "Concrete-first guide to React components, props, JSX, state/events, state ownership, render/commit identity, Effects, refs, accessibility, and measured optimization"},\n        {"path": "public/content/topics/vite.json", "responsibility": "Concrete-first guide to Vite development serving, ESM/HMR, transforms, config/plugins, env modes, production builds, base paths, code splitting, and deployment diagnosis"},\n        {"path": "public/content/topics/html-css-and-javascript.json", "responsibility": "Existing browser-language foundation with related navigation extended to TypeScript, React, and Vite"},\n        {"path": "public/content/topics/git-and-github.json", "responsibility": "Existing delivery foundation with related navigation extended to Node/package management and Vite"},\n        {"path": "scripts/content-utils.mjs", "responsibility": "Authoritative explicit recommended curriculum order plus catalog/search projections"},\n        {"path": "scripts/generate-content-artifacts.mjs", "responsibility": "Recommended-order catalog/bootstrap generation plus serialized search and registry generation for the expanded curriculum"},\n        {"path": "tests/discovery-assets.test.ts", "responsibility": "Regression proof for recommended catalog order and search restoration including the new React topic"},\n        {"path": "README.md", "responsibility": "Current nine-topic curriculum and scalable discovery/search artifact documentation"},\n        {"path": "src/generated/topic-bootstrap.ts", "responsibility": "Regenerated six-topic recommended homepage bootstrap for the nine-topic curriculum"},\n        {"path": "public/catalog/topic-catalog.json", "responsibility": "Regenerated lazy full catalog containing all nine topics and explicit recommended order values"},\n        {"path": "public/search/topic-search.minisearch.json", "responsibility": "Regenerated build-time search index covering all nine topic titles, aliases, keywords, sections, and glossary language"},\n        {"path": "docs/topic-registry.json", "responsibility": "Regenerated nine-topic inventory with current source hashes, section counts, source counts, and 2026-08-08 verification date"},\n        {"path": "changelog.md", "responsibility": "Append-only Turn 8 curriculum and verification record"},\n        {"path": "todo.md", "responsibility": "Append-only Turn 8 completion state and next expansion gate"},\n        {"path": "codemap.json", "responsibility": "Append-only current architecture map for the expanded curriculum"}\n      ]\n    }'''
              closing = '\n  ]\n}\n'
              if not text.endswith(closing):
                  raise SystemExit('codemap closing structure changed unexpectedly')
              text = text[:-len(closing)] + ',\n' + entry + closing
              codemap.write_text(text)
          PY

          rm -f docs/turn8-topic-expansion-failure.txt
          rm .github/workflows/turn8-topic-expansion.yml
          rm docs/turn8-topic-expansion-trigger.txt

