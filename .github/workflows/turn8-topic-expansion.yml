                },
                {
                  'id': 'props-jsx-purity',
                  'title': '2. Props configure components; JSX describes structure; render logic should stay pure',
                  'summary': 'A component should calculate its output from current inputs without changing outside systems during render.',
                  'blocks': [
                    {'type': 'cards', 'items': [
                      {'title': 'Props', 'summary': 'Inputs passed from a parent to configure a child component.', 'example': '<Avatar size={48} user={user} />'},
