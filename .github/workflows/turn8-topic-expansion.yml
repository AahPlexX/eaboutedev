              'sections': [
                {
                  'id': 'components',
                  'title': '1. Start by breaking one screen into reusable pieces of UI',
                  'summary': 'A React component is a JavaScript function that describes part of the interface for the current inputs.',
                  'blocks': [
                    {'type': 'paragraph', 'text': 'Imagine a product page with a heading, price, stock message, and Add to cart button. You can represent the whole page as one component, but smaller components become useful when a piece has a distinct responsibility, repeats, or needs to evolve independently. React does not require every div to become a component.'},
                    {'type': 'code', 'language': 'JSX', 'code': 'function ProductCard({ product }) {\n  return (\n    <article>\n      <h2>{product.name}</h2>\n      <p>${product.price}</p>\n      <button type="button">Add to cart</button>\n    </article>\n  );\n}', 'explanation': 'ProductCard is a component. product is a prop supplied by its parent. JSX lets JavaScript describe a tree of elements. The output still uses semantic browser elements: article, heading, paragraph, and button.'},
                    {'type': 'callout', 'tone': 'definition', 'title': 'Declarative UI', 'body': 'Instead of issuing a sequence such as “find this element, disable it, change this text,” React components describe what the UI should be for the current data and state.'}
