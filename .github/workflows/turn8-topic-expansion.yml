                    {'type': 'comparison', 'items': []} if False else {'type': 'table', 'columns': ['Concern', 'ES modules', 'CommonJS'], 'rows': [
                      ['Typical syntax', 'import / export', 'require() / module.exports'],
                      ['Explicit extension', '.mjs is always ESM', '.cjs is always CommonJS'],
                      ['package.json type', '"type": "module" makes nearby .js files ESM', '"type": "commonjs" makes nearby .js files CommonJS'],
                      ['Loading model', 'Standard module graph with static import syntax and dynamic import()', 'Historical Node loader centered on require()']
                    ], 'caption': 'Choose module behavior deliberately instead of mixing syntax by accident'},
                    {'type': 'code', 'language': 'JavaScript · ESM', 'code': 'export function total(a, b) {\n  return a + b;\n}\n\n// another file\nimport { total } from "./math.js";', 'explanation': 'export makes total part of the module’s public surface. import names the binding the other module needs. In Node ESM, relative specifiers use explicit file extensions.'},
                    {'type': 'checkpoint', 'prompt': 'Why can copying require() code into a project using "type": "module" fail even though both files contain JavaScript?', 'answer': 'Because the module system is part of how Node interprets and loads the file.', 'explanation': 'JavaScript syntax is only one layer. ESM and CommonJS have different loading rules and globals. Check package.json type, file extensions, and the package’s documented exports before changing syntax randomly.'}
                  ]
                },
                {
                  'id': 'process-and-scripts',
                  'title': '6. Scripts and environment values connect the project to the machine running it',
                  'summary': 'Repeatable project commands belong in scripts, while environment-specific configuration enters the process separately from source code.',
                  'blocks': [
                    {'type': 'code', 'language': 'JSON + shell', 'code': '"scripts": {\n  "dev": "vite",\n  "test": "node --test",\n  "check": "pnpm test && tsc -b"\n}\n\n# run the named command\npnpm run check', 'explanation': 'A script gives a shared name to a command sequence. Developers and CI can invoke the same task without memorizing its internal command line.'},
                    {'type': 'code', 'language': 'JavaScript · Node.js', 'code': 'const port = Number(process.env.PORT ?? 3000);\n\nif (!Number.isInteger(port)) {\n  throw new Error("PORT must be an integer");\n}', 'explanation': 'process.env exposes environment values as strings. The code converts PORT to a number and validates it before use. Environment input is external input, so it should not be trusted merely because it came from deployment configuration.'},
                    {'type': 'callout', 'tone': 'warning', 'title': 'Environment variables are not automatically secret', 'body': 'Server-side process variables can hold secrets when the deployment environment protects them, but anything copied into browser code or a public build artifact is visible to the user. Keep secret-bearing configuration on a trusted server boundary.'}
