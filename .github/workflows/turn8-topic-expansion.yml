                  {'label': 'package.json', 'detail': 'Describes the package, scripts, dependency requirements, module interpretation, and other project metadata.'},
                  {'label': 'Package manager + lockfile', 'detail': 'Resolves package versions, installs the dependency graph, and records exact resolved artifacts for repeatable installs.'}
                ]
              },
              'sections': [
                {
                  'id': 'runtime',
                  'title': '1. Start with the question: where will this JavaScript run?',
