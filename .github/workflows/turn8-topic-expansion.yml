                    {'type': 'code', 'language': 'JavaScript · Node.js', 'code': 'import { readFile } from "node:fs/promises";\n\nconst text = await readFile("./message.txt", "utf8");\nconsole.log(text);', 'explanation': 'The import uses a built-in Node module. readFile asks the operating system for a file through Node’s API. await pauses this module until the Promise settles, and console.log writes the result to the process output.'}
                  ]
                },
                {
                  'id': 'manifest',
                  'title': '2. package.json is the project manifest, not the installed packages themselves',
                  'summary': 'The manifest records what the project is, what commands it exposes, and which external packages it expects.',
                  'blocks': [
                    {'type': 'code', 'language': 'JSON · package.json', 'code': '{\n  "name": "learning-app",\n  "private": true,\n  "type": "module",\n  "scripts": {\n    "dev": "vite",\n    "check": "tsc -b"\n  },\n  "dependencies": {\n    "react": "19.2.8"\n  },\n  "devDependencies": {\n    "typescript": "7.0.2"\n  }\n}', 'explanation': 'name identifies the project, private prevents accidental registry publication in tools that honor it, type tells Node how to interpret .js files, scripts name repeatable commands, dependencies are needed by the shipped application, and devDependencies support development or build work.'},
                    {'type': 'cards', 'items': [
                      {'title': 'dependencies', 'summary': 'Packages the application or library needs as part of normal use.', 'example': 'react'},
                      {'title': 'devDependencies', 'summary': 'Tooling used to develop, test, type-check, document, or build the project.', 'example': 'typescript'},
                      {'title': 'peerDependencies', 'summary': 'A compatibility contract saying the consumer should provide a compatible package, common in plugins and libraries.', 'example': 'a React component library expecting React'},
                      {'title': 'optionalDependencies', 'summary': 'Packages whose installation may fail without making the entire package unusable.', 'example': 'an optional platform-specific enhancement'}
                    ]},
                    {'type': 'checkpoint', 'prompt': 'If package.json lists a dependency, does that mean the exact dependency files are permanently stored inside package.json?', 'answer': 'No.', 'explanation': 'package.json declares requirements. The package manager resolves those requirements, installs packages into its managed layout, and records the exact resolved graph in a lockfile.'}
                  ]
                },
                {
                  'id': 'resolution',
                  'title': '3. Installing one package can create a whole dependency graph',
                  'summary': 'A direct dependency can depend on other packages, so the package manager resolves a graph rather than copying one isolated folder.',
                  'visual': {'kind': 'map', 'title': 'One direct dependency can introduce transitive dependencies', 'caption': 'Your manifest names direct requirements; each installed package can bring its own requirements.', 'nodes': [
                    {'label': 'Your app', 'detail': 'Declares direct dependencies in package.json.'},
                    {'label': 'Direct package', 'detail': 'A package you intentionally requested.'},
                    {'label': 'Transitive package A', 'detail': 'Required by the direct package.'},
                    {'label': 'Transitive package B', 'detail': 'May be shared by several packages if the package manager can safely reuse it.'}
                  ]},
                  'blocks': [
                    {'type': 'paragraph', 'text': 'A package manager must choose versions that satisfy declared constraints, download or reuse package archives, verify integrity information where supported, and make the resulting modules resolvable by the project. The installed layout is an implementation detail; your source code should depend on declared package names rather than assuming a particular physical node_modules shape.'},
                    {'type': 'code', 'language': 'Shell · pnpm', 'code': 'pnpm add react\npnpm add -D typescript\npnpm install --frozen-lockfile', 'explanation': 'The first command saves a production dependency. -D saves a development dependency. A frozen install refuses to update an out-of-sync lockfile, which is useful in CI because it turns dependency drift into an explicit failure.'},
