                    {'type': 'code', 'language': 'TypeScript · discriminated union', 'code': 'type RequestState =\n  | { status: "loading" }\n  | { status: "success"; data: string[] }\n  | { status: "error"; message: string };\n\nfunction render(state: RequestState) {\n  switch (state.status) {\n    case "success": return state.data.join(", ");\n    case "error": return state.message;\n    case "loading": return "Loading…";\n  }\n}', 'explanation': 'status is a discriminant: each literal value identifies one valid object shape. That prevents impossible combinations such as a loading state that is accidentally treated as though data definitely exists.'},
