                  'blocks': [
                    {'type': 'code', 'language': 'React', 'code': 'import { useState } from "react";\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\n  return (\n    <button onClick={() => setCount((current) => current + 1)}>\n      Count: {count}\n    </button>\n  );\n}', 'explanation': 'useState returns the state value for this render and a setter. The click handler asks React to calculate a later render with the next count. The updater function receives the latest queued value, which is safer when the next value depends on the previous one.'},
                    {'type': 'paragraph', 'text': 'State behaves like a snapshot: an event handler closes over the values from the render that created that handler. Calling a setter does not rewrite the count variable already captured by the running handler. React queues an update and later renders again.'},
                    {'type': 'checkpoint', 'prompt': 'After setCount(count + 1) runs, should code later in the same event handler assume the local count variable has already changed?', 'answer': 'No.', 'explanation': 'The handler is still executing with the state snapshot from its render. The setter requests a future render. When the next value depends on prior queued updates, use the functional updater form.'}
                  ]
                },
                {
