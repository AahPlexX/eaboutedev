name: Turn 8 workflow regression

on:
  push:
    branches: [main]
    paths:
      - docs/turn8-workflow-regression-trigger.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply minimal Turn 8 newline correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/turn8-topic-expansion.yml')
          text = path.read_text()
          corrected = text.replace(
              'const catalog = topics\\\\n  .map(({ document }, order) => createCatalogEntry(document, order))\\\\n  .toSorted',
              'const catalog = topics\\n  .map(({ document }, order) => createCatalogEntry(document, order))\\n  .toSorted',
          )
          if corrected == text:
              raise SystemExit('Expected double-escaped generator replacement was not found.')
          path.write_text(corrected)
          PY
      - name: Run Turn 8 workflow regression
        shell: bash
        run: |
          set +e
          node --test --experimental-strip-types tests/turn8-workflow.test.ts > /tmp/result.txt 2>&1
          status=$?
          set -e
          cp /tmp/result.txt docs/turn8-workflow-regression-result.txt
          echo "$status" > docs/turn8-workflow-regression-status.txt
      - name: Commit correction and regression evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/turn8-topic-expansion.yml docs/turn8-workflow-regression-result.txt docs/turn8-workflow-regression-status.txt
          git commit -m "fix: correct Turn 8 generator newline mutation"
          git push
