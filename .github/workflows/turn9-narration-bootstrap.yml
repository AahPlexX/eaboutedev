name: Turn 9 narration dependency bootstrap

on:
  push:
    branches: [main]
    paths:
      - docs/turn9-narration-bootstrap-trigger.txt

permissions:
  contents: write

concurrency:
  group: turn9-narration-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Add exact browser narration dependency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add exact Kokoro browser TTS dependency
        run: pnpm add kokoro-js@1.2.1 --save-exact

      - name: Verify exact-version contract
        run: pnpm run validate:versions

      - name: Commit exact dependency graph
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Dependency graph already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: add exact Kokoro browser TTS dependency [turn9-bootstrap]"
          git push
