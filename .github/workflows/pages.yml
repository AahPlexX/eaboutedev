name: Verify and deploy Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh derived artifacts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/index.css')
          text = path.read_text(encoding='utf-8')
          old = 'inset-inline-start: max(0.5rem, env(safe-area-inset-left));'
          new = 'inset-inline-start: max(0.5rem, env(safe-area-inset-left), env(safe-area-inset-right));'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Safe-area inset contract was not found.')
          PY
          pnpm run generate
          if git diff --quiet -- src/index.css src/generated public/search docs/topic-registry.json; then
            echo "Derived artifacts are current."
            exit 0
          fi
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git add src/index.css src/generated public/search docs/topic-registry.json
          git commit -m "build: refresh generated topic artifacts"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Verify generated content artifacts are committed
        run: |
          pnpm run generate
          git diff --exit-code -- src/generated public/search docs/topic-registry.json

      - name: Run full project checks
        run: pnpm run check

  deploy:
    name: Build and deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
