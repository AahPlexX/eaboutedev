name: Turn 8 workflow source correction

on:
  push:
    branches: [main]
    paths:
      - docs/turn8-workflow-fix-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Correct generator replacement string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/turn8-topic-expansion.yml')
          text = path.read_text()
          old = '''          text = text.replace(
              'const catalog = topics.map(({ document }, order) => createCatalogEntry(document, order));',
              'const catalog = topics\\\\n  .map(({ document }, order) => createCatalogEntry(document, order))\\\\n  .toSorted((left, right) => left.order - right.order || left.title.localeCompare(right.title, "en"));'
          )'''
          new = '''          replacement = \'''\'''\'''const catalog = topics
  .map(({ document }, order) => createCatalogEntry(document, order))
  .toSorted((left, right) => left.order - right.order || left.title.localeCompare(right.title, "en"));\'''\'''\'''
          text = text.replace(
              'const catalog = topics.map(({ document }, order) => createCatalogEntry(document, order));',
              replacement,
          )'''
          if old not in text:
              raise SystemExit('Expected malformed Turn 8 replacement was not found; refusing a broad edit.')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/turn8-topic-expansion.yml
          git commit -m "fix: write real newlines in Turn 8 generator mutation"
          git push
