name: Turn 9 codemap append

on:
  push:
    branches:
      - feat/free-neural-read-aloud
    paths:
      - docs/turn9-codemap-trigger.txt

permissions:
  contents: write

concurrency:
  group: turn9-codemap-append
  cancel-in-progress: true

jobs:
  append:
    name: Append Turn 9 code map
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/free-neural-read-aloud

      - name: Append Turn 9 architecture entry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "codemap.json";
          const codemap = JSON.parse(await readFile(path, "utf8"));
          const alreadyRecorded = codemap.entries.some((entry) => entry.turncount === 9 && entry.summary === "Completely free neural read-aloud for every topic");

          if (!alreadyRecorded) {
            codemap.entries.push({
              turncount: 9,
              date: "2026-08-09",
              summary: "Completely free neural read-aloud for every topic",
              areas: [
                { path: "docs/superpowers/specs/2026-08-09-free-neural-read-aloud-design.md", responsibility: "Evidence-backed product, engine, accessibility, performance, and failure-boundary contract for completely free neural topic narration" },
                { path: "docs/superpowers/plans/2026-08-09-free-neural-read-aloud.md", responsibility: "TDD implementation and verification plan for narration projection, worker synthesis, accessible playback, release records, and live deployment checks" },
                { path: "src/lib/narration.ts", responsibility: "Pure TopicDocument-to-bounded-passages projection covering every current educational block type while leaving literal source code and raw URLs visual" },
                { path: "src/workers/narration.worker.ts", responsibility: "User-initiated isolated neural synthesis using exact kokoro-js 1.2.1, Kokoro-82M q8/WASM, af_heart, progress forwarding, Blob audio, and retryable errors" },
                { path: "src/components/topics/topic-narration.tsx", responsibility: "Shared accessible Play/Pause/Resume/Restart/seek/retry player with current passage, visible transcript, next-passage prefetch, and session-scoped generated-audio reuse" },
                { path: "src/pages/topic-page.tsx", responsibility: "Single shared narration integration so all current and future TopicDocument routes inherit free read-aloud automatically" },
                { path: "src/learning.css", responsibility: "Responsive narration controls, transcript/current-state presentation, 2.75rem targets, mobile wrapping, and forced-colors support" },
                { path: "tests/narration.test.ts", responsibility: "Regression proof for complete narration coverage, learner reading order, deterministic bounded passages, and exclusion of literal code/URLs" },
                { path: "tests/narration-runtime.test.ts", responsibility: "Regression proof for exact neural runtime/model/voice/device contract, Worker boundary, accessible player controls/transcript, no autoplay, and no system-speech fallback" },
                { path: "README.md", responsibility: "Current documentation for generated discovery assets plus neural narration runtime, first-use transfer, local-processing/cost boundary, controls, accessibility, and failure behavior" },
                { path: "changelog.md", responsibility: "Append-only Turn 9 research, implementation, CI failure/fix, and successful GitHub-hosted verification evidence" },
                { path: "todo.md", responsibility: "Append-only Turn 9 delivery ledger separating completed implementation gates from merge, Pages deployment, and live browser verification" },
                { path: "codemap.json", responsibility: "Append-only Turn 9 map of the free neural narration architecture and its verification surfaces" }
              ]
            });
            await writeFile(path, `${JSON.stringify(codemap, null, 2)}\n`);
          }
          NODE

      - name: Commit code map entry
        shell: bash
        run: |
          if git diff --quiet -- codemap.json; then
            echo "Turn 9 code map entry already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codemap.json
          git commit -m "docs: map Turn 9 neural narration architecture"
          git push origin HEAD:feat/free-neural-read-aloud
