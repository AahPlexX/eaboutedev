name: Turn 12 recovery diagnostic
on:
  push:
    branches: [main]
    paths: [docs/turn12-recovery-diagnostic-trigger.txt]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Author
        id: author
        continue-on-error: true
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/turn12-topic-expansion.yml').read_text()
          start = text.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          anchor = "def checkpoint(prompt, answer, explanation): return {'type': 'checkpoint', 'prompt': prompt, 'answer': answer, 'explanation': explanation}\n"
          script = script.replace(anchor, anchor + "def checklist(items): return {'type': 'checklist', 'items': items}\n", 1)
          Path('/tmp/turn12-author.py').write_text(script)
          PY
          python -m py_compile /tmp/turn12-author.py
          python /tmp/turn12-author.py
      - name: Anatomy
        id: anatomy
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        run: node --test --experimental-strip-types tests/anatomy-block.test.ts
      - name: Content
        id: content
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        run: pnpm run generate && pnpm run validate:content
      - name: Links
        id: links
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const names = ['browser-devtools-and-systematic-debugging.json','testing-web-applications.json','web-accessibility.json','web-security-foundations.json'];
          const urls=[]; for (const name of names) for (const source of JSON.parse(await readFile(`public/content/topics/${name}`,'utf8')).sources) urls.push(source.url);
          await writeFile('/tmp/urls.txt',[...new Set(urls)].join('\n'));
          NODE
          : > /tmp/links.txt
          failed=0
          while IFS= read -r url; do
            code=$(curl -L -sS -o /dev/null --max-time 30 -w '%{http_code}' "$url" || true)
            echo "$code $url" | tee -a /tmp/links.txt
            case "$code" in 2*|3*) ;; *) failed=1 ;; esac
          done < /tmp/urls.txt
          exit $failed
      - name: Knip
        id: knip
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cat > knip.json <<'JSON'
          {"$schema":"https://unpkg.com/knip@6/schema.json","entry":["src/main.tsx","vite.config.ts","scripts/*.mjs","tests/**/*.test.ts"],"project":["src/**/*.{ts,tsx}","scripts/**/*.mjs","tests/**/*.ts"],"ignore":["src/generated/**"],"includeEntryExports":true}
          JSON
          set +e
          pnpm dlx knip@6.14.2 > /tmp/knip.txt 2>&1
          status=$?
          cat /tmp/knip.txt
          rm knip.json
          exit $status
      - name: Check
        id: check
        if: always() && steps.author.outcome == 'success'
        continue-on-error: true
        run: pnpm run check
      - name: Save diagnostics
        if: always()
        env:
          AUTHOR: ${{ steps.author.outcome }}
          ANATOMY: ${{ steps.anatomy.outcome }}
          CONTENT: ${{ steps.content.outcome }}
          LINKS: ${{ steps.links.outcome }}
          KNIP: ${{ steps.knip.outcome }}
          CHECK: ${{ steps.check.outcome }}
        shell: bash
        run: |
          {
            echo "author=$AUTHOR"
            echo "anatomy=$ANATOMY"
            echo "content=$CONTENT"
            echo "links=$LINKS"
            echo "knip=$KNIP"
            echo "check=$CHECK"
            echo "--- links ---"
            cat /tmp/links.txt 2>/dev/null || true
            echo "--- knip ---"
            cat /tmp/knip.txt 2>/dev/null || true
          } > docs/turn12-recovery-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/turn12-recovery-diagnostic.txt
          git commit -m "test: record Turn 12 recovery diagnostics" || true
          git push origin HEAD:main
