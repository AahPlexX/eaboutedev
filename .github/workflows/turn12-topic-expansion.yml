          PY

      - name: Run focused anatomy regression test
        run: node --test --experimental-strip-types tests/anatomy-block.test.ts

      - name: Regenerate discovery artifacts
        run: pnpm run generate

      - name: Validate every topic and related link
        run: pnpm run validate:content

      - name: Verify new official source URLs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          const names = ['browser-devtools-and-systematic-debugging.json','testing-web-applications.json','web-accessibility.json','web-security-foundations.json'];
          const urls = [];
          for (const name of names) {
            const doc = JSON.parse(await readFile(`public/content/topics/${name}`, 'utf8'));
            for (const source of doc.sources) urls.push(source.url);
          }
          await import('node:fs/promises').then(({ writeFile }) => writeFile('/tmp/source-urls.txt', [...new Set(urls)].join('\n')));
          NODE
          while IFS= read -r url; do
            echo "Checking $url"
            curl --fail --location --silent --show-error --max-time 30 --output /dev/null "$url"
          done < /tmp/source-urls.txt

      - name: Audit dead code and dependencies with exact Knip
        shell: bash
        run: |
          cat > knip.json <<'JSON'
          {
            "$schema": "https://unpkg.com/knip@6/schema.json",
            "entry": ["src/main.tsx", "vite.config.ts", "scripts/*.mjs", "tests/**/*.test.ts"],
            "project": ["src/**/*.{ts,tsx}", "scripts/**/*.mjs", "tests/**/*.ts"],
            "ignore": ["src/generated/**"],
            "includeEntryExports": true
          }
          JSON
          pnpm dlx knip@6.14.2
          rm knip.json

      - name: Run full project gate
        run: pnpm run check

      - name: Record Turn 12 implementation
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          todo = Path('todo.md')
          text = todo.read_text()
          marker = '## Turn 12 — 2026-08-10'
          if marker not in text:
              text += '''\n\n## Turn 12 — 2026-08-10\n\n**turncount: 12**\n\n### Four-topic quality foundation expansion\n\n- [x] Add Browser DevTools and Systematic Debugging.\n- [x] Add Testing Web Applications.\n- [x] Add Web Accessibility.\n- [x] Add Web Security Foundations.\n- [x] Add reusable Syntax Anatomy Diagram / Code Dissection Map content support without a client runtime dependency.\n- [x] Integrate anatomy with typing, rendering, validation, narration, responsive styling, forced colors, and the authoring contract.\n- [x] Add meaningful new related-topic links and explicit dependency order.\n- [x] Regenerate catalog, homepage bootstrap, serialized search index, and topic registry.\n- [x] Verify all new official source URLs resolve successfully.\n- [x] Run exact Knip 6.14.2 dead-code/dependency audit with no unresolved findings.\n- [x] Pass the complete project gate after the final generated state.\n\n### Remaining production gate\n\n- [ ] Verify the exact final state again through the permanent pull-request gate.\n- [ ] Confirm Pages serves the 13-topic catalog and all four new routes.\n- [ ] Inspect anatomy rendering and desktop/mobile reflow on production.\n- [ ] Start, pause, and resume neural narration on at least one new topic.\n'''
              todo.write_text(text)

          changelog = Path('changelog.md')
          text = changelog.read_text()
          if marker not in text:
              text += '''\n\n## Turn 12 — 2026-08-10\n\n**turncount: 12**\n\n### Quality foundations and syntax anatomy\n\n- Expanded the curriculum with complete guides for Browser DevTools and Systematic Debugging, Testing Web Applications, Web Accessibility, and Web Security Foundations.\n- Added a reusable `anatomy` content block that renders an assembled syntax construct plus numbered token-to-meaning explanations. It remains optional and subject-driven rather than a template requirement.\n- Extended narration so syntax-anatomy meaning is spoken without reading punctuation character-by-character.\n- Added schema validation and a focused regression test for the anatomy primitive.\n- Updated related-topic navigation and the recommended curriculum order, then regenerated all discovery artifacts.\n- Verified every new source URL and ran exact Knip 6.14.2 to audit unreachable files, exports, and dependencies before the full project gate.\n- Preserved static GitHub Pages architecture, shared narration inheritance, existing dependencies, and the North Star quality hierarchy.\n'''
              changelog.write_text(text)

          codemap = Path('codemap.json')
          data = json.loads(codemap.read_text())
          if not any(e.get('turncount') == 12 for e in data['entries']):
              data['entries'].append({'turncount': 12, 'date': '2026-08-10', 'summary': 'Four-topic quality foundations plus reusable syntax anatomy teaching block', 'areas': [
                {'path':'src/types/content.ts','responsibility':'AnatomyBlock data contract in the shared content union'},
                {'path':'src/components/topics/content-block.tsx','responsibility':'Accessible shared Syntax Anatomy Diagram / Code Dissection Map renderer'},
                {'path':'src/lib/narration.ts','responsibility':'Meaning-first narration projection for anatomy blocks'},
                {'path':'scripts/validate-content.mjs','responsibility':'Structural validation for anatomy segments plus existing topic/link rules'},
                {'path':'tests/anatomy-block.test.ts','responsibility':'Regression guard for anatomy type/render/validation/narration/docs integration'},
                {'path':'public/content/topics/browser-devtools-and-systematic-debugging.json','responsibility':'Evidence-first browser debugging guide'},
                {'path':'public/content/topics/testing-web-applications.json','responsibility':'Testing boundaries, assertions, isolation, browser automation, flake diagnosis, and CI guide'},
                {'path':'public/content/topics/web-accessibility.json','responsibility':'WCAG 2.2, semantics, keyboard/focus, forms, responsive accessibility, and testing guide'},
                {'path':'public/content/topics/web-security-foundations.json','responsibility':'Browser trust boundaries, SOP/CORS, XSS, CSRF, cookies, CSP, identity, secrets, and verification guide'},
                {'path':'scripts/content-utils.mjs','responsibility':'Explicit recommended order for the expanded 13-topic curriculum'},
                {'path':'docs/content-authoring.md','responsibility':'Subject-driven syntax-anatomy authoring rules without template pressure'},
                {'path':'todo.md','responsibility':'Turn 12 implementation and remaining production gates'},
                {'path':'changelog.md','responsibility':'Turn 12 implementation and audit history'},
                {'path':'codemap.json','responsibility':'Turn 12 architecture and topic map'}
              ]})
              codemap.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Remove temporary workflow and trigger
        run: rm -f .github/workflows/turn12-topic-expansion.yml docs/turn12-topic-expansion-trigger.txt

      - name: Commit verified expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add four quality foundation topics and syntax anatomy"
          git push origin HEAD:main
