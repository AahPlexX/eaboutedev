          topics.append({
            'version': 1,
            'slug': 'web-security-foundations',
            'title': 'Web Security Foundations',
            'eyebrow': 'Know what can cross each trust boundary',
            'summary': 'Build a browser-first security mental model: origins isolate sites, data crosses trust boundaries, output can become executable, credentials change request authority, and layered controls limit the impact of mistakes.',
            'category': 'Security',
            'level': 'Intermediate',
            'estimatedMinutes': 90,
            'icon': 'ShieldCheck',
            'accent': 'oklch(0.57 0.19 28)',
            'aliases': ['web security', 'frontend security', 'application security', 'appsec', 'browser security'],
            'keywords': ['same-origin policy', 'CORS', 'XSS', 'CSRF', 'CSP', 'cookies', 'session', 'authentication', 'authorization', 'HTTPS', 'secrets', 'dependency security'],
            'prerequisites': ['How the Web Works', 'HTML, CSS, and JavaScript', 'APIs and Data Exchange'],
            'learningOutcomes': ['Explain browser origins and why cross-origin access is restricted.', 'Trace untrusted data across input, storage, rendering, and request boundaries.', 'Distinguish XSS, CSRF, CORS, authentication, authorization, and CSP instead of treating them as interchangeable security features.', 'Choose layered controls and verify them with observable browser/network behavior.'],
            'heroVisual': visual('layers', 'Security is layered because no single boundary is perfect', 'A control should reduce a specific risk even when another layer fails.', [('Browser isolation', 'Same-origin rules limit cross-site data access.'), ('Application validation and output handling', 'Data is treated according to the context where it will be used.'), ('Credential and authorization checks', 'The server decides what the authenticated actor is allowed to do.'), ('Response policies', 'Headers such as CSP can restrict what the browser may execute or load.'), ('Operational controls', 'Secrets, dependencies, logging, patching, and incident response reduce exposure and recovery time.')]),
            'sections': [
              {'id': 'trust-boundaries', 'title': 'Start by marking where data and authority cross boundaries', 'summary': 'Security questions become tractable when you identify which actor supplied data, which actor will interpret it, and which credentials are attached.', 'blocks': [paragraph('Treat browser input, URL parameters, network responses, stored user content, third-party scripts, and imported packages as data from a boundary until the receiving context has established what is allowed. “Internal” does not automatically mean trusted: stored data may have originated from a user or an older vulnerable path.'), steps([{'title': 'Identify the actor', 'explanation': 'Who supplied this value or request?'}, {'title': 'Identify the interpreter', 'explanation': 'Will the value become HTML, JavaScript, a URL, SQL, a shell command, a file path, or plain text?'}, {'title': 'Identify attached authority', 'explanation': 'Does the request carry cookies, tokens, server privileges, or access to sensitive data?'}, {'title': 'Apply controls at the boundary', 'explanation': 'Validate allowed input, encode for output context, authorize server actions, and constrain browser execution/loading as applicable.'}]), checkpoint('A value was read from your own database. Is it automatically safe to insert as HTML?', 'No.', 'The database may contain data that originally came from an untrusted source. Safety depends on the output context and how the value is encoded or constructed when rendered.') ]},
              {'id': 'origins-and-cors', 'title': 'The same-origin policy limits what one site can read from another', 'summary': 'Origin is based on scheme, host, and port. CORS is a controlled server opt-in for cross-origin response access; it is not a general authentication mechanism.', 'blocks': [paragraph('Browsers isolate origins so a script on one site cannot freely read sensitive data from another site where the user may already be authenticated. Cross-origin resource sharing uses HTTP response headers to tell the browser which origins may access a response through frontend JavaScript.'), table(['Concept', 'Question it answers', 'Not the same as'], [['Same-origin policy', 'May this document/script freely access this other origin?', 'Server authorization'], ['CORS', 'May frontend JavaScript from this origin read this cross-origin response?', 'Authentication or CSRF protection'], ['Authentication', 'Who is the actor?', 'Permission to perform every action'], ['Authorization', 'May this actor perform this action on this resource?', 'Identity proof alone']], 'Keep browser access policy, identity, and permission checks conceptually separate.'), callout('warning', 'CORS is enforced by browsers', 'A server must still authenticate and authorize sensitive actions. A non-browser client is not constrained by the browser’s CORS enforcement model.') ]},
              {'id': 'xss', 'title': 'Cross-site scripting happens when untrusted data becomes executable browser content', 'summary': 'The core defense is to keep data as data for the context where it is used, then add defense-in-depth controls.', 'blocks': [paragraph('XSS can occur when attacker-controlled content is inserted into a context where the browser interprets it as executable markup or script. Prefer APIs and framework behavior that render text as text. When constructing HTML or other executable contexts, use context-appropriate escaping/sanitization and avoid unsafe sinks.'), cards([{'title': 'Stored XSS', 'summary': 'Malicious content is stored and later rendered to users.'}, {'title': 'Reflected XSS', 'summary': 'Request-controlled content is immediately reflected into an executable response context.'}, {'title': 'DOM-based XSS', 'summary': 'Client-side code takes attacker-influenced data and writes it into an unsafe DOM execution context.'}]), checkpoint('Does validating that a string contains only 200 characters prevent XSS?', 'No.', 'Length validation can be useful for business constraints, but it does not ensure the value is safe for a specific HTML, attribute, URL, CSS, or JavaScript output context.') ]},
              {'id': 'csrf-and-credentials', 'title': 'CSRF abuses ambient credentials on a request the user did not intend', 'summary': 'The attacker may not need to read the response if the browser is willing to send an authenticated state-changing request.', 'blocks': [paragraph('Cookies can be attached automatically according to their scope and attributes. A CSRF defense makes the server distinguish an intended state-changing request from a request initiated by another site. SameSite cookie settings can reduce some cross-site cookie sending, and CSRF tokens or origin checks can add request intent evidence where appropriate.'), anatomy('A secure session cookie combines several independent restrictions', 'HTTP', 'Each cookie attribute addresses a different browser behavior. No one attribute replaces server authorization.', [('Set-Cookie: session=opaque-value', 'Session cookie', 'The server stores an opaque session identifier in the browser. The identifier should not encode secrets that the client must protect itself.'), ('; Secure', 'HTTPS-only transport', 'The browser sends the cookie only over secure connections, subject to the cookie rules.'), ('; HttpOnly', 'Script access restriction', 'Client-side JavaScript cannot read the cookie through `document.cookie`, reducing one credential-theft path.'), ('; SameSite=Lax', 'Cross-site sending policy', 'Restricts when the cookie is sent with cross-site requests. The exact SameSite choice must match the application flow.'), ('; Path=/', 'Path scope', 'Limits which request paths receive the cookie; `/` means the whole origin path space.')]), callout('note', 'Cookie attributes reduce risk; the server still authorizes', 'A valid session identifies an authenticated context. Every sensitive server action still needs authorization based on the actor and resource.') ]},
              {'id': 'csp', 'title': 'Content Security Policy constrains which resources and scripts the browser may use', 'summary': 'CSP is defense in depth: a meaningful policy can reduce exploitability when an injection bug reaches the page.', 'blocks': [anatomy('A small CSP states default and script-specific source rules', 'HTTP', 'The policy is a response header. Directives are separated by semicolons and each directive controls a resource category or policy behavior.', [('Content-Security-Policy: ', 'Header name', 'Tells the browser to enforce the supplied content security policy.'), ("default-src 'self'; ", 'Default source rule', 'Uses the current origin as the fallback source list for resource types without a more specific directive.'), ("script-src 'self' ", 'Script source rule', 'Overrides the default for JavaScript and allows scripts from the current origin.'), ("'nonce-r4nd0m'", 'Per-response nonce example', 'Allows a script whose nonce matches the unpredictable nonce supplied for this response. A real nonce must be generated securely for each response rather than hard-coded.')]), paragraph('A CSP that merely exists is not necessarily strong. Review the effective directives and allowed sources. Avoid weakening the policy with broad unsafe allowances merely to silence violations. Report-only mode can help observe a proposed policy before enforcement, but it does not itself block loads.') ]},
              {'id': 'identity-secrets-dependencies', 'title': 'Identity, authorization, secrets, and dependencies have different owners', 'summary': 'Browser code is visible to the user; server authorization and secret storage must not depend on hiding client code.', 'blocks': [cards([{'title': 'Authentication', 'summary': 'Establishes who or what the actor is.'}, {'title': 'Authorization', 'summary': 'Checks whether that actor may perform the requested action on the resource.'}, {'title': 'Secret', 'summary': 'A credential or sensitive value that must remain outside public client bundles and repositories.'}, {'title': 'Dependency trust', 'summary': 'Third-party code becomes part of the application’s execution and supply-chain surface.'}]), paragraph('Anything delivered to browser JavaScript should be treated as visible to the user. Public identifiers and publishable client keys can exist in frontend configuration when the service explicitly designs them as public, but privileged API secrets belong on a server or trusted execution boundary. Pin and review dependencies according to project policy and remove unused packages so they do not expand the maintenance and supply-chain surface.') ]},
              {'id': 'verify-security', 'title': 'Verify controls at the layer that enforces them', 'summary': 'Security review needs source analysis plus runtime evidence: headers, cookies, request authority, DOM sinks, and server responses.', 'blocks': [steps([{'title': 'Reproduce the protected action', 'explanation': 'Know the normal request, credentials, and expected authorization result.'}, {'title': 'Inspect browser/network policy', 'explanation': 'Observe CORS, CSP, cookie attributes, redirects, and HTTPS behavior rather than assuming configuration loaded.'}, {'title': 'Test untrusted-data paths', 'explanation': 'Trace how input is stored, transformed, and rendered. Verify the final interpreter treats it in the intended context.'}, {'title': 'Test authorization separately from UI', 'explanation': 'A hidden or disabled button is not a server permission check. Send a direct request under an actor that should be denied.'}, {'title': 'Preserve evidence and minimize sensitive data', 'explanation': 'Record reproducible results without copying secrets or private production data into logs.'}]), callout('tip', 'Security is a property to keep verifying', 'Browsers, dependencies, routes, headers, and application features change. Keep high-value security invariants in tests and deployment checks where they can fail close to the change that breaks them.') ]}
            ],
