8rem; }\n.syntax-anatomy-map p { margin: 0; color: var(--muted-foreground); font-size: 0.84rem; line-height: 1.55; }\n@media (max-width: 40rem) { .syntax-anatomy-map { grid-template-columns: 1fr; } }\n@media (forced-colors: active) { .syntax-anatomy, .syntax-anatomy-map li, .syntax-anatomy-marker { border-color: CanvasText; } .syntax-anatomy-segment { border-color: Highlight; } }\n'''
