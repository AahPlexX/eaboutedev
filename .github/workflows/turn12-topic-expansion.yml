                  (' })', 'Call boundary', 'The browser can now attempt the request. A fulfilled fetch promise does not by itself mean the HTTP status represents success.')
                ]),
                steps([
                  {'title': 'Did a request exist?', 'explanation': 'If no relevant request appears, debug the client path that should create it.'},
                  {'title': 'Did it target the right resource?', 'explanation': 'Check URL, method, payload, credentials, and request headers.'},
                  {'title': 'What came back?', 'explanation': 'Inspect status, response headers, body, redirects, and timing rather than inferring from UI copy.'},
                  {'title': 'What did the client do with the response?', 'explanation': 'If the response is correct, continue into parsing, state updates, and rendering.'}
                ])
              ]},
              {'id': 'application-and-performance', 'title': 'Application state and performance need their own evidence', 'summary': 'Storage, caches, service workers, and performance traces can produce bugs that source inspection alone cannot explain.', 'blocks': [
                paragraph('The Application panel exposes browser-managed state such as storage and caches. Use it when stale or missing local state changes behavior. For performance, record a trace or use performance tooling so you can see main-thread work, rendering, loading, and long tasks. Do not optimize from intuition when a trace can show the expensive stage.'),
                cards([
                  {'title': 'Storage mismatch', 'summary': 'Inspect the stored key/value or database record that the page actually reads.', 'whenToUse': 'Behavior changes after sign-in, refresh, or returning to the site.'},
                  {'title': 'Cache or service worker mismatch', 'summary': 'Verify which resource version was served and whether a worker controls the page.', 'whenToUse': 'A deploy appears correct for some visitors but stale for others.'},
                  {'title': 'Performance trace', 'summary': 'Measure where time is spent before changing code.', 'whenToUse': 'The problem is slow interaction, loading, scripting, layout, or rendering.'}
                ]),
                callout('warning', 'Do not confuse an audit suggestion with a root cause', 'Automated audits can identify likely improvements. A specific production slowdown still needs measured evidence that connects the user-visible delay to the work you plan to change.')
              ]},
              {'id': 'systematic-loop', 'title': 'Debug from the earliest failing stage', 'summary': 'The shortest useful fix is usually at the first point where reality stops matching the system contract.', 'blocks': [
                steps([
                  {'title': 'Preserve the failing case', 'explanation': 'Keep the original reproduction or turn it into a regression test when practical.'},
                  {'title': 'Trace backward from the symptom', 'explanation': 'Ask what immediate state produced the symptom, then what produced that state, until you reach the earliest unexpected value or event.'},
                  {'title': 'State one hypothesis', 'explanation': 'Name one cause and a discriminating observation that would be different if the hypothesis were false.'},
                  {'title': 'Make one minimal correction', 'explanation': 'Fix the identified cause without bundling unrelated refactors.'},
                  {'title': 'Repeat the original path', 'explanation': 'Verify the symptom is gone and the intended state transition now occurs.'}
                ]),
                callout('definition', 'A good debugging result reduces uncertainty', '“It works now” is weaker than “the request used the wrong path; Network showed a 404; correcting the path produced 200 and the original user flow now passes.” Keep the evidence chain.')
              ]},
              {'id': 'production-debugging', 'title': 'Production debugging adds transformed code, privacy, and environment differences', 'summary': 'A production system may not have the same source, data, flags, timing, or permissions as development.', 'blocks': [
                paragraph('Production bundles may be minified or transformed, so source maps can help map deployed execution back to authored files when they are available and intentionally published. Treat user data, credentials, tokens, request bodies, and storage as sensitive while debugging. Do not copy production secrets into logs or issue trackers.'),
                checklist(['Record the environment and deployed version before comparing behavior.', 'Confirm source-map availability rather than assuming stack frames map directly to source.', 'Use sanitized reproductions when production data is sensitive.', 'Verify network, cache, feature-flag, and authentication differences between environments.', 'Remove temporary debugging instrumentation that exposes data or changes timing before release.'])
              ]}
            ],
            'glossary': [
              {'term': 'Breakpoint', 'definition': 'A configured point where the debugger pauses JavaScript execution so current state can be inspected.'},
              {'term': 'Call stack', 'definition': 'The active chain of function calls that led to the current execution point.'},
              {'term': 'Computed style', 'definition': 'The CSS value the browser resolves for a property after cascade, inheritance, and value processing.'},
              {'term': 'HAR', 'definition': 'HTTP Archive, a structured format used to represent recorded network request information.'},
              {'term': 'Source map', 'definition': 'Metadata that can map transformed or bundled code locations back to authored source locations.'},
