              {'id': 'barriers-first', 'title': 'Start with the barrier a person encounters', 'summary': 'Accessibility requirements become concrete when you ask what information or action is unavailable and why.', 'blocks': [paragraph('A mouse-only custom control creates a barrier for a person who uses a keyboard. An image that carries meaning without text can create a barrier when it cannot be seen. A form field without a programmatic name can be difficult to identify through assistive technology. The engineering task is to preserve the same purpose and action through the interfaces people use.'), cards([{'title': 'Perception barrier', 'summary': 'Meaning depends on color, vision, hearing, or another single channel without an alternative.'}, {'title': 'Operation barrier', 'summary': 'A control requires a pointer gesture or focus behavior that some users cannot perform.'}, {'title': 'Understanding barrier', 'summary': 'Labels, instructions, errors, or changes do not clearly communicate what happened or what to do next.'}, {'title': 'Compatibility barrier', 'summary': 'Custom semantics or state are not exposed in a way assistive technology can interpret.'}]), checkpoint('If a control has excellent color contrast but cannot be reached by keyboard, is it accessible?', 'No.', 'Contrast addresses one presentation need. Operability is a separate requirement. Accessibility is not satisfied by one strong characteristic when another essential interaction path is blocked.') ]},
              {'id': 'wcag-model', 'title': 'WCAG turns broad accessibility goals into testable success criteria', 'summary': 'WCAG 2.2 organizes guidance under four principles and defines conformance through success criteria.', 'blocks': [paragraph('W3C organizes WCAG 2.2 under Perceivable, Operable, Understandable, and Robust. Success criteria are technology-independent statements at levels A, AA, and AAA. A Level AA conformance claim includes all applicable Level A and AA criteria; W3C does not verify a site’s conformance claim for you.'), table(['Level', 'Meaning in the conformance model', 'Practical interpretation'], [['A', 'Includes all Level A success criteria', 'Minimum conformance layer, not a complete usability target'], ['AA', 'Includes all Level A and AA success criteria', 'A common target for web products and policies'], ['AAA', 'Includes A, AA, and AAA success criteria', 'Not all content can satisfy every AAA criterion']], 'WCAG conformance levels are cumulative.'), callout('note', 'Use the current standard', 'W3C recommends WCAG 2.2 for current work. Supporting Understanding and Techniques documents help interpretation, but the normative success criteria define conformance.') ]},
              {'id': 'semantics-and-names', 'title': 'Native HTML gives controls meaning before ARIA is added', 'summary': 'Elements, labels, headings, landmarks, and control text create semantics that browsers expose to accessibility APIs.', 'blocks': [paragraph('Prefer the native HTML element that already has the needed behavior and semantics. A real button is focusable and activatable with expected keyboard behavior. A div with a click handler does not become an equivalent button merely because it looks like one.'), anatomy('A label and input create a visible and programmatic relationship', 'HTML', 'The visible word “Email” becomes the form control’s accessible name because the label points to the input id.', [('<label for="email">', 'Label relationship', 'The `for` value identifies the form control whose label this text represents.'), ('Email', 'Visible label text', 'The user can see the purpose, and the associated control can derive its accessible name from this text.'), ('</label>\n', 'Label end', 'Closes the label element before the control.'), ('<input id="email" ', 'Matching control id', 'The id matches the label’s `for` value and creates the explicit association.'), ('name="email" type="email" ', 'Form and input semantics', 'The name participates in form submission; the email type gives the browser useful input semantics.'), ('autocomplete="email">', 'Input-purpose metadata', 'The autocomplete token communicates the expected user data purpose to supporting browsers and assistive features.')]), callout('warning', 'ARIA supplements HTML', 'If a native HTML element provides the semantics and behavior you need, prefer it. Adding ARIA to a non-semantic element does not automatically add keyboard behavior or all native interaction rules.') ]},
              {'id': 'keyboard-and-focus', 'title': 'Anything interactive must have a usable keyboard and focus path', 'summary': 'Keyboard access depends on semantics, focus order, activation behavior, and visible focus—not only whether Tab can reach something.', 'blocks': [checklist := {'type': 'checklist', 'items': ['Use native interactive elements when they match the control.', 'Keep DOM/focus order aligned with meaningful reading and interaction order.', 'Do not use positive tabindex values to manually reorder the page.', 'Ensure focused controls have a visible focus indicator.', 'Support expected keyboard activation and escape behavior for custom composite widgets.', 'Do not require a dragging gesture when a simpler alternative can perform the same operation.']}, paragraph('Focus should move because the user moved it or because the interface changed context in a way that requires managed focus. Unexpected focus movement can make the page difficult to understand. Test the complete task with only a keyboard, not only individual controls.') ]},
              {'id': 'forms-errors-and-status', 'title': 'Forms need names, instructions, errors, and state changes that stay connected', 'summary': 'A visual red border is not enough if the user cannot identify which field failed, why, and how to correct it.', 'blocks': [steps([{'title': 'Give each control a clear name', 'explanation': 'Use visible labels and native associations when possible.'}, {'title': 'Provide instructions before the error happens', 'explanation': 'Required format or constraints should not be discoverable only after submission.'}, {'title': 'Connect error text to the control', 'explanation': 'Use appropriate native/ARIA relationships so the error can be discovered programmatically.'}, {'title': 'Move or announce status intentionally', 'explanation': 'When submission changes content without navigation, make the result discoverable without unexpectedly stealing focus.'}]), checkpoint('A required field is outlined red after submit but no text explains the problem. What information is missing?', 'The error cannot be reliably understood without the visual color cue.', 'Provide text that identifies the error and connect it to the relevant field. Color can reinforce state, but it should not be the only way meaning is conveyed.') ]},
              {'id': 'responsive-visual-motion', 'title': 'Accessibility must survive zoom, reflow, touch, contrast, and motion preferences', 'summary': 'A layout that works only at one viewport, text size, pointer precision, or motion setting excludes real use conditions.', 'blocks': [paragraph('WCAG 2.2 includes requirements that affect responsive design and interaction, including reflow, target size, focus visibility, and dragging alternatives. Test at high zoom and narrow CSS widths because zoom effectively reduces the available layout width. Content should reflow without requiring two-dimensional page scrolling except where a two-dimensional layout is essential.'), cards([{'title': 'Reflow', 'summary': 'Content adapts to a narrow effective viewport instead of forcing page-level horizontal scrolling.'}, {'title': 'Target size', 'summary': 'Interactive targets meet the applicable minimum or an allowed exception.'}, {'title': 'Contrast', 'summary': 'Text and important UI indicators remain distinguishable under required contrast conditions.'}, {'title': 'Reduced motion', 'summary': 'Motion that can be reduced or disabled respects the user’s preference where applicable.'}]) ]},
              {'id': 'testing-accessibility', 'title': 'Automated checks find classes of defects; human interaction tests find others', 'summary': 'No single scanner can prove the interface is understandable and operable.', 'blocks': [steps([{'title': 'Inspect semantics', 'explanation': 'Check headings, landmarks, names, roles, states, form associations, and image alternatives.'}, {'title': 'Use keyboard-only paths', 'explanation': 'Complete important tasks without a pointer and observe focus order/visibility.'}, {'title': 'Test zoom and narrow reflow', 'explanation': 'Check content and controls at high zoom/narrow CSS width without losing information or action.'}, {'title': 'Use automated rules', 'explanation': 'Catch detectable issues consistently, but treat the result as partial coverage.'}, {'title': 'Use assistive technology for representative flows', 'explanation': 'Confirm important semantics and dynamic changes are actually understandable through the supported accessibility API path.'}]), callout('tip', 'Test the task, not only the page', 'A page can have valid landmarks and labels while the complete checkout, upload, modal, or error-recovery flow still traps focus or hides status.') ]},
              {'id': 'accessibility-production', 'title': 'Accessibility is a regression property of the product system', 'summary': 'Shared components, design tokens, linting, review, automated checks, and browser tests can prevent repeated defects.', 'blocks': [paragraph('The strongest accessibility work moves repeatable requirements into shared components and verification. A correctly implemented Button or Dialog can protect semantics across many screens, but it still needs context-specific labels and workflow testing. Do not claim conformance from component tests alone when page content and application flows can introduce new barriers.'), checklist(['Keep semantic requirements in reusable components where behavior is truly shared.', 'Include keyboard/focus and accessible-name assertions in important browser tests.', 'Review new visual patterns for non-color cues, reflow, target size, and motion.', 'Treat accessibility regressions as product defects with reproducible test cases.', 'Keep conformance statements scoped to what was actually evaluated.']) ]}
            ],
            'glossary': [{'term': 'Accessible name', 'definition': 'The programmatic name that identifies the purpose of a user-interface element to assistive technology.'}, {'term': 'ARIA', 'definition': 'Accessible Rich Internet Applications roles and attributes that supplement semantics when native HTML alone cannot express the needed pattern.'}, {'term': 'Focus', 'definition': 'The current element that receives keyboard input and other focus-based interaction.'}, {'term': 'Semantic HTML', 'definition': 'HTML elements chosen for the meaning and behavior they represent, not only their visual appearance.'}, {'term': 'Reflow', 'definition': 'Content adapting to the available viewport so information and operation are retained without unnecessary two-dimensional scrolling.'}, {'term': 'WCAG', 'definition': 'Web Content Accessibility Guidelines, W3C recommendations containing testable success criteria for web accessibility.'}],
            'related': ['html-css-and-javascript', 'react', 'testing-web-applications', 'browser-devtools-and-systematic-debugging'],
            'sources': [{'label': 'WCAG 2.2 Recommendation', 'url': 'https://www.w3.org/TR/WCAG22/', 'accessed': accessed}, {'label': 'W3C WCAG 2 Overview', 'url': 'https://www.w3.org/WAI/standards-guidelines/wcag/', 'accessed': accessed}, {'label': 'MDN ARIA', 'url': 'https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA', 'accessed': accessed}, {'label': 'MDN Accessible name', 'url': 'https://developer.mozilla.org/en-US/docs/Glossary/Accessible_name', 'accessed': accessed}, {'label': 'MDN Keyboard accessible', 'url': 'https://developer.mozilla.org/en-US/docs/Web/Accessibility/Guides/Understanding_WCAG/Keyboard', 'accessed': accessed}]
