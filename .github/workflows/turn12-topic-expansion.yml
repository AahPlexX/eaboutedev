name: Turn 12 topic expansion

on:
  push:
    branches: [main]
    paths:
      - docs/turn12-topic-expansion-trigger.txt

permissions:
  contents: write

concurrency:
  group: turn12-topic-expansion
  cancel-in-progress: true

jobs:
  integrate:
    name: Integrate topics and verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Write topic expansion and anatomy integration
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          accessed = '2026-08-10'

          def visual(kind, title, caption, nodes):
              return {'kind': kind, 'title': title, 'caption': caption, 'nodes': [{'label': a, 'detail': b} for a, b in nodes]}

          def paragraph(text): return {'type': 'paragraph', 'text': text}
          def callout(tone, title, body): return {'type': 'callout', 'tone': tone, 'title': title, 'body': body}
          def checkpoint(prompt, answer, explanation): return {'type': 'checkpoint', 'prompt': prompt, 'answer': answer, 'explanation': explanation}
          def cards(items): return {'type': 'cards', 'items': items}
          def steps(items): return {'type': 'steps', 'items': items}
          def table(columns, rows, caption): return {'type': 'table', 'columns': columns, 'rows': rows, 'caption': caption}
          def anatomy(title, language, caption, segments): return {'type': 'anatomy', 'title': title, 'language': language, 'caption': caption, 'segments': [{'code': a, 'label': b, 'explanation': c} for a, b, c in segments]}

          topics = []

          topics.append({
            'version': 1,
            'slug': 'browser-devtools-and-systematic-debugging',
            'title': 'Browser DevTools and Systematic Debugging',
            'eyebrow': 'Observe before you guess',
            'summary': 'Learn how to turn a vague browser problem into evidence: reproduce it, observe the earliest failing layer, form one testable hypothesis, and verify the fix with browser developer tools.',
            'category': 'Debugging',
            'level': 'Foundational',
            'estimatedMinutes': 70,
            'icon': 'Bug',
            'accent': 'oklch(0.58 0.15 245)',
            'aliases': ['devtools', 'browser debugger', 'chrome devtools', 'debugging', 'inspect element'],
            'keywords': ['elements', 'styles', 'console', 'sources', 'breakpoint', 'network', 'request', 'response', 'storage', 'performance', 'source map', 'stack trace'],
            'prerequisites': ['How the Web Works', 'HTML, CSS, and JavaScript'],
            'learningOutcomes': [
              'Choose the DevTools panel that observes the layer where a symptom can originate.',
              'Trace a browser problem from reproducible symptom to the earliest failing stage instead of changing code at random.',
              'Inspect DOM/CSS, JavaScript execution, network traffic, storage, and performance evidence.',
              'Separate authored source from deployed or transformed source and verify a fix against the original failure.'
            ],
            'heroVisual': visual('flow', 'A debugging loop that narrows uncertainty', 'A useful debugging action removes possible causes. Each observation should make the next test more specific.', [
              ('Reproduce', 'State the exact action, environment, and result that demonstrates the problem.'),
              ('Observe', 'Inspect the layer that owns the symptom instead of editing the most visible code.'),
              ('Locate', 'Find the earliest point where actual state diverges from expected state.'),
              ('Hypothesize', 'Name one cause that would explain the evidence and one observation that could disprove it.'),
              ('Change', 'Make the smallest correction that addresses the identified cause.'),
              ('Verify', 'Repeat the original reproduction and relevant regression checks.')
            ]),
            'sections': [
              {'id': 'symptom-to-evidence', 'title': 'Start with a reproducible symptom, not a theory', 'summary': 'Debugging gets faster when you freeze the observed problem before you explain it.', 'blocks': [
                paragraph('A browser problem usually arrives as a symptom: a button does nothing, a layout shifts, data never appears, or the page feels slow. The symptom is evidence about an outcome, not yet evidence about its cause. First record the exact action, browser state, URL, input, and visible result that reproduces it.'),
                steps([
                  {'title': 'Describe expected and actual results', 'explanation': 'Write the smallest observable difference. “Save should show Saved, but the spinner never ends” is more useful than “Save is broken.”'},
                  {'title': 'Make it repeatable', 'explanation': 'Reload or reset state and confirm the same sequence produces the problem again. Note when it does not reproduce.'},
                  {'title': 'Choose the owning layer', 'explanation': 'Visual layout points first to DOM/CSS; an exception points to JavaScript execution; missing data points to network or application state; slowness points to measured performance evidence.'},
                  {'title': 'Inspect before changing', 'explanation': 'Collect one observation from that layer. Do not change code merely to see what happens.'}
                ]),
                checkpoint('A click does nothing. Should you immediately rewrite the click handler?', 'No.', 'First confirm whether the intended element received the event, whether the handler ran, and whether an earlier state or network failure prevented the expected result. A code change before that observation can hide the real cause.')
              ]},
              {'id': 'elements-and-styles', 'title': 'Elements and Styles show what the browser actually built', 'summary': 'The DOM and computed CSS are runtime results. They may differ from what you think the source produced.', 'visual': visual('layers', 'From markup to pixels', 'Inspect the result at the layer where it exists.', [('DOM', 'The parsed and script-modified document tree.'), ('Rules', 'Matched declarations plus cascade and inheritance.'), ('Computed values', 'The final values used for layout and painting.'), ('Rendered result', 'What the user sees and can interact with.')]), 'blocks': [
                paragraph('Use the Elements panel when the symptom is about structure, content, state attributes, classes, focus, or layout. Inspect the live element, not only the source file. JavaScript can add, remove, or modify nodes after the original HTML loads.'),
                cards([
                  {'title': 'A rule is crossed out', 'summary': 'The declaration lost in the cascade or is inactive. Inspect which declaration won and why.', 'whenToUse': 'A style exists in source but does not affect the element.'},
                  {'title': 'A property is missing', 'summary': 'The selector may not match, the stylesheet may not have loaded, or a conditional rule may not apply.', 'whenToUse': 'You expect a declaration but cannot find it among matched rules.'},
                  {'title': 'The DOM is different', 'summary': 'Runtime code, browser parsing, or framework rendering changed the tree.', 'whenToUse': 'The page structure does not match the file you opened in your editor.'}
                ]),
                callout('tip', 'Use temporary edits as experiments', 'Changing a CSS declaration in DevTools is useful for testing a hypothesis. Unless a workspace or override mechanism is configured, treat that edit as an experiment that must still be applied and verified in source code.')
              ]},
              {'id': 'console-and-sources', 'title': 'Console and Sources expose JavaScript state over time', 'summary': 'Errors show where execution failed; breakpoints let you stop before the failure and inspect how state got there.', 'blocks': [
                paragraph('The Console is useful for runtime errors, warnings, logged values, and small expressions against the current page. The Sources debugger becomes more powerful when you need to know how a value changed. A breakpoint pauses execution so you can inspect scope, the call stack, and the next statement before state changes again.'),
                table(['Evidence', 'What it tells you', 'Next question'], [['Exception and stack', 'Where the browser observed an uncaught failure and the calls that led there', 'Which earlier input or state made this line invalid?'], ['Breakpoint scope', 'Values available at a precise execution point', 'Which value first differs from the expected invariant?'], ['Call stack', 'The chain of active function calls', 'Which caller supplied the problematic state?'], ['Source map status', 'Whether deployed code maps back to authored source', 'Am I debugging my source or only transformed output?']], 'JavaScript debugging evidence and the question it enables.'),
                checkpoint('Why is a breakpoint often stronger evidence than adding several console.log calls?', 'It freezes the program at a known execution point.', 'You can inspect multiple values and the call stack before later statements change them. Logs can still help, but they are observations chosen in advance and can miss the state you later discover matters.')
              ]},
              {'id': 'network', 'title': 'Network evidence separates browser code from server and transport failures', 'summary': 'A UI can be correct while its request, response, cache behavior, or server contract is wrong.', 'blocks': [
                paragraph('Use the Network panel when the symptom depends on a resource or API call. Record the request and inspect its URL, method, status, timing, request headers or payload, response headers, and response body. Reload with the panel open when you need the full page-load sequence.'),
                anatomy('A fetch request has several independent failure points', 'JavaScript', 'This small request can fail before sending, during transport, at the server, while decoding the response, or while applying the result.', [
                  ('fetch(', 'Request API', 'Starts a browser fetch operation. It returns a promise for a Response when an HTTP response is available.'),
                  ('"/api/profile"', 'Target', 'The URL identifies the requested resource. A relative URL is resolved against the page URL.'),
                  (', { method: "POST", ', 'Request options', 'The options object changes the HTTP method and can also carry headers, credentials, and a body.'),
