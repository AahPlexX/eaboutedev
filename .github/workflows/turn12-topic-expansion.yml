            'icon': 'TestTube2',
            'accent': 'oklch(0.61 0.14 155)',
            'aliases': ['web testing', 'unit testing', 'integration testing', 'e2e testing', 'end to end testing', 'playwright'],
            'keywords': ['assertion', 'fixture', 'isolation', 'mock', 'browser automation', 'locator', 'flaky test', 'CI', 'regression', 'cross browser'],
            'prerequisites': ['HTML, CSS, and JavaScript', 'Node.js and Package Management', 'Browser DevTools and Systematic Debugging'],
            'learningOutcomes': ['Choose a test boundary that matches the behavior and risk you need evidence about.', 'Write assertions against observable outcomes instead of implementation details.', 'Control test state and asynchronous behavior so failures are reproducible.', 'Diagnose flaky browser tests and organize fast-to-slow verification in CI.'],
            'heroVisual': visual('layers', 'Different tests answer different questions', 'A larger test boundary gives more integration confidence but also introduces more moving parts.', [('Pure logic', 'One function or module with controlled inputs.'), ('Integrated feature', 'Several modules or a component working together.'), ('Browser behavior', 'Rendered UI, events, navigation, network, and accessibility semantics.'), ('System flow', 'The deployed or production-like stack across service boundaries.')]),
            'sections': [
              {'id': 'contract-first', 'title': 'A test is a repeatable claim about observable behavior', 'summary': 'Start with the behavior that matters, then choose the smallest boundary that can prove it.', 'blocks': [paragraph('A useful test has three ideas: a known starting state, an action or input, and an observable outcome. Framework syntax comes later. If the test cannot state what contract it protects, it can pass while the product is still wrong.'), steps([{'title': 'Name the risk', 'explanation': 'What regression would matter to a user, caller, or maintainer?'}, {'title': 'Choose the observation', 'explanation': 'Prefer public output, rendered behavior, or stable state over private implementation details.'}, {'title': 'Choose the smallest sufficient boundary', 'explanation': 'Do not open a browser to prove arithmetic; do not unit-test a DOM helper and claim the user flow works.'}, {'title': 'Make the result deterministic', 'explanation': 'Control data, time, network behavior, and cleanup as far as the chosen boundary requires.'}]), checkpoint('A unit test proves a formatter returns the right text. Does that prove the formatted text is visible and accessible in the browser?', 'No.', 'It proves only the formatter contract. Rendering, CSS, DOM semantics, event wiring, and browser behavior require a larger boundary.') ]},
              {'id': 'test-boundaries', 'title': 'Choose boundaries by failure cost and feedback speed', 'summary': 'Unit, integration, browser, and system tests overlap; their value comes from what they can observe cheaply and reliably.', 'blocks': [table(['Boundary', 'Good evidence for', 'Main cost'], [['Unit', 'Pure logic, parsing, transformations, state reducers', 'Can miss integration and browser behavior'], ['Integration', 'Collaborating modules or component behavior', 'More setup and shared state'], ['Browser/E2E', 'Real DOM, navigation, events, accessibility semantics, browser APIs', 'Slower and more sensitive to environment'], ['System/deployed', 'Real service/configuration/deployment contracts', 'Highest setup cost and least isolation']], 'Choose the smallest boundary that can observe the behavior at risk.'), callout('tip', 'Test public behavior first', 'A test coupled to private function calls can fail during harmless refactoring or pass while the user-visible contract is broken. Prefer outcomes a real consumer can observe.') ]},
              {'id': 'assertions-and-locators', 'title': 'Assertions define success; locators define what the user can reach', 'summary': 'Browser tests should locate meaningful UI and wait for observable state instead of racing the page.', 'blocks': [anatomy('A browser test expresses setup, action, and an auto-waiting expectation', 'Playwright', 'Each part protects a different part of the behavior contract.', [('test("saves the profile", async ({ page }) => {\n  ', 'Test boundary', 'Names the behavior and receives an isolated browser page fixture.'), ('await page.goto("/profile");\n  ', 'Known starting page', 'Navigation establishes where the interaction begins.'), ('await page.getByRole("button", { name: "Save" }).click();\n  ', 'User-oriented action', 'A role-and-name locator targets the control through semantics close to how assistive technology and users identify it.'), ('await expect(page.getByRole("status")).toHaveText("Saved");\n', 'Observable assertion', 'The web assertion repeatedly checks the rendered status until it matches or times out.'), ('});', 'Test end', 'The test completes only after awaited actions and assertions finish.')]), paragraph('Playwright web assertions retry until the expected condition is met or a timeout is reached. This is different from adding arbitrary sleep delays. A fixed delay guesses when the page will be ready; a condition-based assertion observes readiness.'), checkpoint('Why is `await page.waitForTimeout(2000)` usually weaker than waiting for the expected UI state?', 'The fixed delay waits for time, not correctness.', 'It can be longer than needed on fast runs and still too short on slow runs. Condition-based waiting ties progress to the state the test actually needs.') ]},
              {'id': 'isolation-and-fixtures', 'title': 'Isolation makes a failure belong to the test that reports it', 'summary': 'Tests should not secretly depend on execution order, leftovers from another test, or a shared user session.', 'blocks': [paragraph('A deterministic test can start from a known state even when run alone, after another test, or in parallel. Browser contexts provide isolated cookies and storage. Fixtures can create data or resources and clean them up. Use mocks only when replacing a dependency is part of the boundary you intentionally chose.'), cards([{'title': 'Fixture', 'summary': 'Creates known test state or resources and can centralize cleanup.', 'whenToUse': 'Several tests need the same reliable setup.'}, {'title': 'Mock or stub', 'summary': 'Replaces a collaborator with controlled behavior.', 'whenToUse': 'The collaborator is outside the boundary you want to test.', 'avoidWhen': 'You need evidence that the real integration contract works.'}, {'title': 'Seeded real dependency', 'summary': 'Uses the real dependency with controlled data.', 'whenToUse': 'Integration behavior itself is part of the risk.'}]) ]},
              {'id': 'coverage-beyond-happy-path', 'title': 'Test important states, not every line for its own sake', 'summary': 'Failures, boundaries, accessibility, browser differences, and recovery often contain the highest-risk behavior.', 'blocks': [checklist := {'type': 'checklist', 'items': ['Normal success with representative input.', 'Validation and rejected input.', 'Empty, loading, disabled, and error states that the user can encounter.', 'Keyboard operation and accessible names for important controls.', 'Relevant viewport/browser differences based on supported users.', 'Network or service failure where the feature promises recovery.', 'Regression case for each important bug that escaped earlier checks.']}, paragraph('Coverage metrics can reveal unexecuted code, but a percentage is not proof that meaningful behavior was asserted. A line can execute without its result being checked. Start from risk and contracts, then use coverage as supporting evidence.') ]},
              {'id': 'flaky-tests', 'title': 'A flaky test is an unresolved uncertainty, not background noise', 'summary': 'Retries can collect evidence, but they should not turn nondeterminism into a green build without investigation.', 'blocks': [steps([{'title': 'Classify the failure', 'explanation': 'Determine whether the product, test, environment, or external dependency changed.'}, {'title': 'Find uncontrolled state', 'explanation': 'Look for shared data, order dependence, clocks, random input, network variation, animation, and detached elements.'}, {'title': 'Replace timing guesses with conditions', 'explanation': 'Wait on the state required by the next action or assertion.'}, {'title': 'Preserve artifacts', 'explanation': 'Keep traces, screenshots, console output, and network evidence when they help reproduce the failure.'}, {'title': 'Fix the cause', 'explanation': 'Do not permanently increase timeouts when the real problem is an incorrect readiness condition.'}]), callout('warning', 'A retry is not a fix', 'A retry can tell you whether a failure is intermittent. If the final result ignores repeated first-attempt failures, the suite is hiding uncertainty rather than removing it.') ]},
