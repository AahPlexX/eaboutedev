name: Turn 10 governance records

on:
  push:
    branches: [main]
    paths:
      - docs/turn10-governance-trigger.txt

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Append governance records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          todo = Path('todo.md')
          todo_marker = '## Turn 10 — 2026-08-09'
          todo_text = todo.read_text()
          if todo_marker not in todo_text:
              todo_text = todo_text.rstrip() + '''\n\n## Turn 10 — 2026-08-09\n\n**turncount: 10**\n\n### Model-agnostic topic quality governance\n\n- [x] Research current cross-agent repository instruction conventions from authoritative OpenAI, Anthropic, Google, and AGENTS.md/AAIF sources.\n- [x] Add root `NORTHSTAR.md` as the canonical educational-quality constitution for all topic additions, rewrites, and curriculum expansions.\n- [x] Define observable quality dimensions rather than forcing one repeated topic template.\n- [x] Govern epistemic integrity, zero-gap continuity, mechanistic understanding, progressive depth, explanatory density, example integrity, decision literacy, failure literacy, production realism, visual semantics, human readability, accessibility, curriculum coherence, integration integrity, and consistency without sameness.\n- [x] Add a current-date authoritative-source research protocol, publication self-audit, hard prohibitions, and explicit instruction hierarchy.\n- [x] Add a short root `AGENTS.md` as the vendor-neutral agent entry point.\n- [x] Add thin `CLAUDE.md` and `GEMINI.md` adapters that route those agent ecosystems to the same North Star instead of duplicating policy.\n- [x] Update `docs/content-authoring.md` so it is explicitly subordinate to the North Star on educational quality and does not imply identical topic outlines.\n- [x] Update `README.md` so human contributors encounter the same governance hierarchy.\n- [x] Preserve topic JSON, generated discovery artifacts, application runtime, dependencies, and client-facing content unchanged.\n'''
              todo.write_text(todo_text)

          changelog = Path('changelog.md')
          change_marker = '## Turn 10 — 2026-08-09'
          change_text = changelog.read_text()
          if change_marker not in change_text:
              change_text = change_text.rstrip() + '''\n\n## Turn 10 — 2026-08-09\n\n**turncount: 10**\n\n### Model-agnostic content quality governance\n\n- Added `NORTHSTAR.md` as the repository's canonical definition of topic quality, intentionally governing outcomes rather than imposing a fixed page/template silhouette.\n- Qualified the project's quality bar through observable dimensions covering truth/evidence, no-gap dependency continuity, causal/mechanistic teaching, beginner-to-production depth, examples, decisions/trade-offs, failure diagnosis, production constraints, meaningful visuals, human readability, accessibility, curriculum coherence, and repository integration.\n- Added an authoritative current-date research protocol and explicit prohibitions against guessing, stale model-memory claims, low-authority convenience sourcing, unexplained jargon/code, decorative visuals, unconditional “best” claims, filler, arbitrary omission, template cloning, and weakening validation/governance to force acceptance.\n- Added `AGENTS.md` as the short cross-agent entry point and thin `CLAUDE.md` / `GEMINI.md` adapters so multiple agent ecosystems converge on the same governing document rather than maintaining vendor-specific policy copies.\n- Updated `docs/content-authoring.md` to clarify that its sequence is a dependency/encoding contract rather than a mandatory heading template and that North Star quality remains the publication gate.\n- Updated `README.md` with the governance hierarchy for human contributors.\n- No topic source, generated discovery artifact, application code, dependency, narration behavior, or client-facing lesson content changed in this governance turn.\n'''
              changelog.write_text(change_text)

          codemap = Path('codemap.json')
          data = json.loads(codemap.read_text())
          exists = any(entry.get('turncount') == 10 and entry.get('summary') == 'Model-agnostic topic quality North Star' for entry in data.get('entries', []))
          if not exists:
              data['entries'].append({
                  'turncount': 10,
                  'date': '2026-08-09',
                  'summary': 'Model-agnostic topic quality North Star',
                  'areas': [
                      {'path': 'NORTHSTAR.md', 'responsibility': 'Canonical, vendor-neutral definition of publishable topic quality, research discipline, self-audit, prohibitions, and instruction hierarchy without a rigid topic template'},
                      {'path': 'AGENTS.md', 'responsibility': 'Short open-format agent entry point that routes cross-vendor coding agents to the canonical governance and current authoring/registry context'},
                      {'path': 'CLAUDE.md', 'responsibility': 'Thin Claude Code project adapter importing the shared agent guidance, North Star, and content-authoring contract'},
                      {'path': 'GEMINI.md', 'responsibility': 'Thin Gemini project adapter directing topic work to the shared agent guidance, North Star, authoring contract, and registry'},
                      {'path': 'docs/content-authoring.md', 'responsibility': 'Current JSON/block/visual authoring contract explicitly subordinate to North Star educational quality and clarified as non-template dependency guidance'},
                      {'path': 'README.md', 'responsibility': 'Human-facing discovery of the canonical topic-governance hierarchy'},
                      {'path': 'changelog.md', 'responsibility': 'Append-only Turn 10 governance change record'},
                      {'path': 'todo.md', 'responsibility': 'Append-only Turn 10 governance completion record'},
                      {'path': 'codemap.json', 'responsibility': 'Append-only map of the model-agnostic topic-governance surfaces'}
                  ]
              })
              codemap.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Remove temporary closeout files and commit
        shell: bash
        run: |
          rm -f .github/workflows/turn10-governance-records.yml docs/turn10-governance-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo.md changelog.md codemap.json .github/workflows/turn10-governance-records.yml docs/turn10-governance-trigger.txt
          git commit -m "docs: record Turn 10 topic governance"
          git push origin HEAD:main
