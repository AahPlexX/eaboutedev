name: Semantic inline TDD

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-inline-tdd.yml
      - tests/rich-text.test.ts
      - src/lib/rich-text.ts
      - src/components/topics/inline-content.tsx
      - src/types/content.ts
      - scripts/validate-content.mjs
      - src/components/topics/content-block.tsx
      - src/components/topics/topic-section.tsx
      - src/components/topics/topic-visual.tsx
      - src/pages/topic-page.tsx
      - src/lib/narration.ts
      - scripts/content-utils.mjs
      - docs/content-authoring.md

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test --experimental-strip-types tests/rich-text.test.ts
