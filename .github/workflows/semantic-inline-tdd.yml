name: Semantic inline TDD

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-inline-tdd.yml
      - tests/rich-text.test.ts
      - src/lib/rich-text.ts
      - src/components/topics/inline-content.tsx
      - src/types/content.ts
      - scripts/validate-content.mjs
      - src/components/topics/content-block.tsx
      - src/components/topics/topic-section.tsx
      - src/components/topics/topic-visual.tsx
      - src/pages/topic-page.tsx
      - src/lib/narration.ts
      - scripts/content-utils.mjs
      - docs/content-authoring.md

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run focused rich-text tests
        id: focused_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test --experimental-strip-types tests/rich-text.test.ts > /tmp/semantic-inline-test.txt 2>&1
          status=$?
          cat /tmp/semantic-inline-test.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist failure diagnostic
        if: steps.focused_test.outputs.status != '0'
        shell: bash
        run: |
          cp /tmp/semantic-inline-test.txt docs/semantic-inline-tdd-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/semantic-inline-tdd-diagnostic.txt
          git commit -m "test: record semantic inline TDD failure" || true
          git push origin HEAD:main
      - name: Enforce focused test result
        if: steps.focused_test.outputs.status != '0'
        run: exit 1
