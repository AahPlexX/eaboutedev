name: Turn 8 live curriculum QA

on:
  push:
    branches: [main]
    paths:
      - docs/turn8-live-qa-trigger.txt

permissions:
  contents: write

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install exact Playwright outside project graph
        shell: bash
        run: |
          mkdir -p /tmp/eaboutedev-turn8-qa
          cd /tmp/eaboutedev-turn8-qa
          npm init -y >/dev/null
          npm install --save-exact playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Verify four deployed guides and narration inheritance
        shell: bash
        run: |
          cat > /tmp/eaboutedev-turn8-qa/qa.mjs <<'NODE'
          import { chromium } from "playwright";
          import { writeFile } from "node:fs/promises";

          const base = "https://aahplexx.github.io/eaboutedev/#/topics/";
          const topics = [
            ["nodejs-and-package-management", "Node.js and Package Management"],
            ["typescript", "TypeScript"],
            ["react", "React"],
            ["vite", "Vite"],
          ];
          const result = {
            checkedAt: new Date().toISOString(),
            playwright: "1.62.0",
            routes: [],
            reactNeuralStarted: false,
            reactPauseWorked: false,
            reactResumeWorked: false,
            consoleErrors: [],
            relevantFailedResponses: [],
            success: false,
            failure: null,
          };

          const browser = await chromium.launch({ headless: true });
          const consoleErrors = [];
          const failedResponses = [];

          try {
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const page = await context.newPage();
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("response", (response) => {
              const host = new URL(response.url()).hostname;
              if ((host.includes("jsdelivr.net") || host.includes("huggingface.co") || host.includes("hf.co")) && response.status() >= 400) {
                failedResponses.push({ url: response.url(), status: response.status() });
              }
            });

            for (const [slug, title] of topics) {
              let rendered = false;
              for (let attempt = 0; attempt < 24; attempt += 1) {
                await page.goto(`${base}${slug}`, { waitUntil: "domcontentloaded", timeout: 30_000 });
                try {
                  await page.getByRole("heading", { level: 1, name: title }).waitFor({ state: "visible", timeout: 5_000 });
                  await page.getByRole("heading", { name: "Listen to this topic" }).waitFor({ state: "visible", timeout: 5_000 });
                  rendered = true;
                  break;
                } catch {
                  await page.waitForTimeout(3_000);
                }
              }
              if (!rendered) throw new Error(`Deployed route did not render expected guide: ${slug}`);
              const desktopNoHorizontalOverflow = await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 1);
              result.routes.push({ slug, title, rendered: true, narrationPlayer: true, desktopNoHorizontalOverflow });
            }

            await page.goto(`${base}react`, { waitUntil: "domcontentloaded", timeout: 30_000 });
            await page.getByRole("heading", { level: 1, name: "React" }).waitFor({ state: "visible", timeout: 10_000 });
            await page.getByRole("button", { name: "Play narration" }).click();
            const neuralOutcome = await Promise.race([
              page.waitForFunction(() => {
                const audio = document.querySelector("audio");
                return Boolean(audio && !audio.paused && Number.isFinite(audio.duration) && audio.duration > 0);
              }, { timeout: 240_000 }).then(() => "playing"),
              page.locator(".narration-status").filter({ hasText: /High-quality narration is unavailable|could not start|could not be played/i }).waitFor({ state: "visible", timeout: 240_000 }).then(() => "error"),
            ]);
            if (neuralOutcome !== "playing") throw new Error(`React neural narration failed: ${await page.locator('.narration-status').innerText()}`);
            result.reactNeuralStarted = true;
            await page.getByRole("button", { name: "Pause" }).click();
            await page.locator(".narration-status").filter({ hasText: /Paused at passage/ }).waitFor({ state: "visible", timeout: 10_000 });
            result.reactPauseWorked = await page.evaluate(() => Boolean(document.querySelector("audio")?.paused));
            await page.getByRole("button", { name: "Resume" }).click();
            await page.waitForFunction(() => Boolean(document.querySelector("audio") && !document.querySelector("audio").paused), { timeout: 10_000 });
            result.reactResumeWorked = true;
            await context.close();

            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const mobilePage = await mobile.newPage();
            for (const route of result.routes) {
              await mobilePage.goto(`${base}${route.slug}`, { waitUntil: "domcontentloaded", timeout: 30_000 });
              await mobilePage.getByRole("heading", { level: 1, name: route.title }).waitFor({ state: "visible", timeout: 10_000 });
              route.mobileNoHorizontalOverflow = await mobilePage.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 1);
            }
            await mobile.close();

            result.consoleErrors = consoleErrors;
            result.relevantFailedResponses = failedResponses;
            result.success = Boolean(
              result.routes.length === 4 &&
              result.routes.every((route) => route.rendered && route.narrationPlayer && route.desktopNoHorizontalOverflow && route.mobileNoHorizontalOverflow) &&
              result.reactNeuralStarted && result.reactPauseWorked && result.reactResumeWorked &&
              result.consoleErrors.length === 0 && result.relevantFailedResponses.length === 0
            );
          } catch (error) {
            result.failure = error instanceof Error ? error.message : String(error);
            result.consoleErrors = consoleErrors;
            result.relevantFailedResponses = failedResponses;
          } finally {
            await browser.close();
            await writeFile(`${process.env.GITHUB_WORKSPACE}/docs/turn8-live-qa-result.json`, `${JSON.stringify(result, null, 2)}\n`);
          }
          NODE
          cd /tmp/eaboutedev-turn8-qa
          node qa.mjs

      - name: Commit evidence and remove ephemeral QA
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/turn8-live-qa-result.json
          git rm .github/workflows/turn8-live-qa.yml docs/turn8-live-qa-trigger.txt
          git commit -m "test: record Turn 8 live curriculum QA"
          git push

      - name: Enforce result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile("docs/turn8-live-qa-result.json", "utf8"));
          if (!result.success) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify(result, null, 2));
          NODE
